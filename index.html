function renderMyTimelineFor(managerKey){
  const el = document.getElementById('mytimeline-detail');
  const m = getManager(managerKey);
  if(!m){ el.innerHTML = `<div class="empty-state">Unknown manager.</div>`; return; }
  const years = m.years;
  el.innerHTML = `
    <div class="card">
      <h3>${m.name}</h3>
      <div style="color:var(--text-dim);font-size:12.5px;margin-bottom:10px;">Fellowship member ${seasonLabel(years[0])} – ${seasonLabel(years[years.length-1])}</div>
      <div style="overflow-x:auto;">
      <table class="data-table table-scroll-min">
        <thead><tr><th>Season</th><th>Team Name</th><th>Record</th><th>PF</th><th>PA</th><th>Finish</th><th></th></tr></thead>
        <tbody>
          ${years.map(y => {
            const season = DB.seasons[y];
            const team = season ? (season.teams||[]).find(t => t.managerKey === managerKey) : null;
            let record = '—', pf = '—', pa = '—', finish = '—';
            if(team){
              record = `${team.wins}\u2013${team.losses}`;
              pf = fmtNum(team.pf,0);
              pa = fmtNum(team.pa,0);
            }
            // Prefer the real (playoff-inclusive) order of finish when we have it —
            // more accurate than reconstructing rank from regular-season games alone.
            if(FINAL_STANDINGS[y] && FINAL_STANDINGS[y].order){
              const pos = FINAL_STANDINGS[y].order.indexOf(managerKey);
              if(pos !== -1) finish = `#${pos+1} of ${FINAL_STANDINGS[y].order.length}`;
            } else if(team){
              const ranked = [...(season.teams||[])].sort((a,b) => b.wins-a.wins || b.pf-a.pf);
              const rank = ranked.findIndex(t => t.managerKey === managerKey) + 1;
              if(rank > 0) finish = `#${rank} of ${ranked.length}`;
            }
            const isChamp = FINAL_STANDINGS[y] && FINAL_STANDINGS[y].champion === managerKey;
            return `<tr>
              <td>${seasonLabel(y)}</td>
              <td>${getTeamName(managerKey,y)}</td>
              <td style="font-family:var(--font-mono);">${record}</td>
              <td style="font-family:var(--font-mono);">${pf}</td>
              <td style="font-family:var(--font-mono);">${pa}</td>
              <td style="white-space:nowrap;">${finish}</td>
              <td>${isChamp ? `<span class="trophy-chip"><i class="ti ti-trophy"></i>Champion</span>` : ''}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function renderStandingsTableBody(){
  const body = document.getElementById('standings-table-body');
  if(!body) return;
  const records = computeAllTimeManagerRecords();
  const champCounts = {};
  Object.values(FINAL_STANDINGS).forEach(f => { champCounts[f.champion] = (champCounts[f.champion]||0) + 1; });

  let rows = Object.entries(records).map(([k,d]) => ({
    k, ...d,
    pct: (d.wins+d.losses) ? d.wins/(d.wins+d.losses) : 0,
    titles: champCounts[k] || 0
  }));

  const dir = standingsSort.dir;
  const sf = {
    wins:(a,b)=>(a.wins-b.wins)*dir, pct:(a,b)=>(a.pct-b.pct)*dir,
    pf:(a,b)=>(a.pf-b.pf)*dir, pa:(a,b)=>(a.pa-b.pa)*dir, titles:(a,b)=>(a.titles-b.titles)*dir
  };
  rows.sort((a,b) => (sf[standingsSort.col] || sf.wins)(a,b) || (b.pf-a.pf));

  const deltas = computeStandingsRankDeltas();

  body.innerHTML = rows.map((r,i) => `<tr ${r.k===DB.myManagerKey?'style="font-weight:700;"':''}>

}

function renderPlayersTableBody(){
  const body = document.getElementById('players-table-body');
  if(!body) return;
  const search = normalizeNameForMatch(document.getElementById('players-search')?.value || '');
  const posFilter = document.getElementById('players-pos-filter')?.value || 'all';
  const selected = DB.selectedPlayersYear || 'all';
  const selectedMgr = DB.selectedPlayersManager || 'all';

  let starters = selected === 'all' ? DB.allStarters : DB.allStarters.filter(s => s.year === selected);
  if(selectedMgr !== 'all') starters = starters.filter(s => s.managerKey === selectedMgr);

  const agg = {};
  starters.forEach(s => {
    if(!agg[s.pid]) agg[s.pid] = {pid:s.pid, starts:0, total:0, best:0};
    agg[s.pid].starts++;
    agg[s.pid].total += (s.points || 0);
    if((s.points || 0) > agg[s.pid].best) agg[s.pid].best = s.points || 0;
  });

  let rows = Object.values(agg).map(p => {
    const meta = DB.playerMeta[p.pid] || {};
    const positions = getPlayerPositions(p.pid, selected === 'all' ? CURRENT_SEASON : selected);
    return {...p, name: meta.name || `Player ${p.pid}`, teamAbbr: meta.teamAbbr || '', positions, avg: p.starts ? p.total/p.starts : 0};
  });

  if(search) rows = rows.filter(r => normalizeNameForMatch(r.name).includes(search));
  if(posFilter !== 'all') rows = rows.filter(r => r.positions.includes(posFilter));

  const dir = playersSort.dir;
  const sf = {
    total:(a,b)=>(a.total-b.total)*dir,
    starts:(a,b)=>(a.starts-b.starts)*dir,
    avg:(a,b)=>(a.avg-b.avg)*dir,
    best:(a,b)=>(a.best-b.best)*dir
  };
  rows.sort(sf[playersSort.col] || sf.total);

  const {deltas} = computeAllTimeRankDeltas();

  if(!rows.length){ body.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-faint);padding:24px;">No players found.</td></tr>`; return; }

  body.innerHTML = rows.slice(0,200).map(r => `<tr>
    <td><span class="player-link" onclick="openPlayerModal('${r.pid}');return false;">${r.name}</span></td>

    <td>${fmtNum(r.total)}</td>
    <td>${r.starts}</td>
    <td>${fmtNum(r.avg)}</td>

/* ============================================================
   LEAGUE TIMELINE
   Reduced awards profile per league rules — champions only, no
   runner-up/loser trophies exist for basketball.
   ============================================================ */
// Finds the championship game for a season using Sleeper's own winners_bracket p===1
// entry — the same authoritative source the Playoffs page now uses, rather than the
// earlier heuristic of guessing which matchup's participants matched the final order.
function getChampionshipGame(year){
  const season = DB.seasons[year];
  const bracket = DB.playoffBrackets[year];
  const playoffWeeks = DB.playoffMatchupsByWeek[year];
  if(!season || !bracket || !playoffWeeks) return null;

  // p===1 is normally excluded by loadPlayoffData's filter only for p===3 (3rd place) —
  // p===1 (championship) is intentionally kept, so look for it directly here.
  let champMatch = bracket.find(b => b.p === 1);
  if(!champMatch){
    // Some seasons' bracket data may not tag p===1 explicitly; fall back to the
    // single final-round match if there's exactly one.
    const maxRound = Math.max(...bracket.map(b => b.r));
    const finalRoundMatches = bracket.filter(b => b.r === maxRound);
    if(finalRoundMatches.length === 1) champMatch = finalRoundMatches[0];
  }
  if(!champMatch) return null;

  const week = season.playoffWeekStart + champMatch.r - 1;
  const mus = playoffWeeks[week] || [];
  const e1 = mus.find(m => m.roster_id === champMatch.t1);
  const e2 = mus.find(m => m.roster_id === champMatch.t2);
  if(!e1 || !e2) return null;

  const k1 = season.rosterIdToManagerKey[champMatch.t1], k2 = season.rosterIdToManagerKey[champMatch.t2];
  const champKey = champMatch.w === champMatch.t1 ? k1 : k2;
  const runnerUpKey = champMatch.w === champMatch.t1 ? k2 : k1;
  const champPts = champMatch.w === champMatch.t1 ? getTeamComputedTotal(e1) : getTeamComputedTotal(e2);
  const runnerUpPts = champMatch.w === champMatch.t1 ? getTeamComputedTotal(e2) : getTeamComputedTotal(e1);
  return {champKey, runnerUpKey, champPts, runnerUpPts};
}

function renderLeagueTradesList(){
  const el = document.getElementById('trades-list');
  const yrF = document.getElementById('trades-yr-filter').value;
  const mgrF = document.getElementById('trades-mgr-filter').value;
  const sortF = document.getElementById('trades-sort-filter')?.value || 'recent';

  let trades = [...DB.transactions];
  if(yrF !== 'all') trades = trades.filter(t => t.year === Number(yrF));

  const tradeData = trades.map(t => {
    const season = DB.seasons[t.year];
    const [r1, r2] = t.roster_ids || [0,0];
    const mk1 = season ? season.rosterIdToManagerKey[r1] : null;
    const mk2 = season ? season.rosterIdToManagerKey[r2] : null;
    const adds = t.adds || {};
    const buildSide = (rid) => {
      const items = Object.entries(adds).filter(([,r]) => r === rid).map(([pid]) => {
        const meta = DB.playerMeta[pid] || {};
        const pts = DB.allStarters.filter(s => s.pid === pid && s.year >= t.year && s.teamRosterId === rid).reduce((a,b) => a+(b.points||0), 0);
        return {name: meta.name || pid, pts};
      });
      (t.draft_picks || []).filter(p => p.owner_id === rid).forEach(p => {
        items.push({name:`${p.season || t.year} Round ${p.round} pick`, pts:0});
      });
      return items;
    };
    const side1 = buildSide(r1), side2 = buildSide(r2);
    const total1 = side1.reduce((a,b)=>a+b.pts,0), total2 = side2.reduce((a,b)=>a+b.pts,0);
    return {t, mk1, mk2, side1, side2, total1, total2, combined: total1+total2, winnerTotal: Math.max(total1,total2), loserTotal: Math.min(total1,total2)};
  }).filter(d => mgrF === 'all' || d.mk1 === mgrF || d.mk2 === mgrF);

  const sortFns = {
    recent:(a,b) => b.t.year-a.t.year || b.t.week-a.t.week,
    combined:(a,b) => b.combined-a.combined,
    winner:(a,b) => b.winnerTotal-a.winnerTotal,
    loser:(a,b) => b.loserTotal-a.loserTotal
  };
  tradeData.sort(sortFns[sortF] || sortFns.recent);

  if(!tradeData.length){ el.innerHTML = `<div class="empty-state"><i class="ti ti-arrows-exchange"></i>No trades found.</div>`; return; }

  el.innerHTML = tradeData.map(({t, mk1, mk2, side1, side2, total1, total2}) => `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;color:var(--text-faint);font-size:11.5px;margin-bottom:10px;">
        <span>${seasonLabel(t.year)} \u00b7 Week ${t.week}</span>
        <span>${(getManager(mk1)||{}).name||mk1} \u2194 ${(getManager(mk2)||{}).name||mk2}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>
          <div style="font-weight:600;font-size:12.5px;margin-bottom:6px;">${(getManager(mk1)||{}).name||mk1} received</div>
          ${side1.map(p => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${p.name}</span><span style="color:var(--text-faint);">${p.pts>0?p.pts.toFixed(1)+' pts':'—'}</span></div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">Draft picks only</div>'}
          <div style="font-weight:700;font-size:12.5px;margin-top:6px;${total1>=total2?'color:var(--good);':''}">${total1.toFixed(1)} pts total${total1>=total2?' \u2713':''}</div>
        </div>
        <div>
          <div style="font-weight:600;font-size:12.5px;margin-bottom:6px;">${(getManager(mk2)||{}).name||mk2} received</div>
          ${side2.map(p => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${p.name}</span><span style="color:var(--text-faint);">${p.pts>0?p.pts.toFixed(1)+' pts':'—'}</span></div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">Draft picks only</div>'}
          <div style="font-weight:700;font-size:12.5px;margin-top:6px;${total2>total1?'color:var(--good);':''}">${total2.toFixed(1)} pts total${total2>total1?' \u2713':''}</div>

      </div>
    </div>`).join('');
}

/* ============================================================
   PLAYOFFS
   Built from DB.playoffBrackets (Sleeper's winners_bracket, authoritative — see
   loadPlayoffData) plus DB.playoffMatchupsByWeek for actual scores. Seeds are derived
   from each bracket participant's regular-season record (best record among playoff
   qualifiers = 1 seed), since Sleeper's bracket entries don't carry a seed number
   directly. Losers bracket and 3rd-place games are excluded per league rules.
   ============================================================ */
function computeAllTimePlayoffStandings(){
  const agg = {};
  Object.keys(MANAGERS).forEach(k => { agg[k] = {championships:0, runnerUps:0, appearances:0}; });

  Object.entries(FINAL_STANDINGS).forEach(([yr, f]) => {
    const year = Number(yr);
    if(!f.order) return;
    const season = DB.seasons[year];
    const bracket = DB.playoffBrackets[year] || [];
    const madePlayoffs = new Set();
    bracket.forEach(b => {
      const k1 = season ? season.rosterIdToManagerKey[b.t1] : null;
      const k2 = season ? season.rosterIdToManagerKey[b.t2] : null;
      if(k1) madePlayoffs.add(k1);
      if(k2) madePlayoffs.add(k2);
    });
    madePlayoffs.forEach(k => { if(agg[k]) agg[k].appearances++; });
    if(f.order[0] && agg[f.order[0]]) agg[f.order[0]].championships++;
    if(f.order[1] && agg[f.order[1]]) agg[f.order[1]].runnerUps++;
  });

  return Object.entries(agg).map(([k,d]) => ({k, ...d})).filter(d => d.appearances>0 || d.championships>0);
}

// Seed = rank among ONLY the teams that actually appear in the bracket, by regular-season
// wins/PF — not rank among all 12 teams, since seed 1 belongs to the best playoff
// qualifier specifically.
function computePlayoffSeeds(year, bracket){
  const season = DB.seasons[year];
  const rosterIds = new Set();
  bracket.forEach(b => { rosterIds.add(b.t1); rosterIds.add(b.t2); });
  const participants = [...rosterIds].map(rid => {
    const team = (season.teams || []).find(t => t.rosterId === rid);
    return {rosterId: rid, wins: team ? team.wins : 0, pf: team ? team.pf : 0};
  });
  participants.sort((a,b) => b.wins-a.wins || b.pf-a.pf);
  const seedMap = {};
  participants.forEach((p,i) => { seedMap[p.rosterId] = i+1; });
  return seedMap;
}

function renderPlayoffsFor(year){
  const el = document.getElementById('playoffs-detail');
  const season = DB.seasons[year];
  const bracket = DB.playoffBrackets[year];
  const playoffWeeks = DB.playoffMatchupsByWeek[year];
  if(!season || !bracket || !bracket.length){
    el.innerHTML = `<div class="empty-state"><i class="ti ti-tournament"></i>No playoff bracket data loaded for ${seasonLabel(year)}.</div>`;
    return;
  }
  const seedMap = computePlayoffSeeds(year, bracket);
  const rounds = [...new Set(bracket.map(b => b.r))].sort((a,b) => a-b);
  const maxRound = rounds[rounds.length-1];

  const roundLabel = (r) => {
    const fromEnd = maxRound - r;
    if(fromEnd === 0) return '\u{1F3C6} Championship';
    if(fromEnd === 1) return 'Semifinals';
    if(fromEnd === 2) return 'Quarterfinals';
    return `Round ${r}`;
  };

  const getScore = (r, rosterId) => {
    const week = season.playoffWeekStart + r - 1;
    const mus = (playoffWeeks && playoffWeeks[week]) || [];
    const entry = mus.find(m => m.roster_id === rosterId);
    return entry ? getTeamComputedTotal(entry) : null;
  };

  let html = `<div style="display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;">`;
  rounds.forEach(r => {
    const matches = bracket.filter(b => b.r === r).sort((a,b) => (a.m||0)-(b.m||0));
    html += `<div style="min-width:230px;flex-shrink:0;">
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:10px;text-align:center;">${roundLabel(r)}</div>
      <div style="display:flex;flex-direction:column;gap:16px;">`;
    matches.forEach(b => {
      const k1 = season.rosterIdToManagerKey[b.t1], k2 = season.rosterIdToManagerKey[b.t2];
      const s1 = getScore(r, b.t1), s2 = getScore(r, b.t2);
      html += `<div class="card" style="padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;${b.w===b.t1?'font-weight:700;':'color:var(--text-faint);'}">
          <span><span style="color:var(--text-faint);font-size:11px;margin-right:6px;">#${seedMap[b.t1]||'?'}</span>${(getManager(k1)||{}).name||k1}</span>
          <span style="font-family:var(--font-mono);">${s1!=null?fmtNum(s1):'—'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;${b.w===b.t2?'font-weight:700;':'color:var(--text-faint);'}">
          <span><span style="color:var(--text-faint);font-size:11px;margin-right:6px;">#${seedMap[b.t2]||'?'}</span>${(getManager(k2)||{}).name||k2}</span>
          <span style="font-family:var(--font-mono);">${s2!=null?fmtNum(s2):'—'}</span>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  el.innerHTML = html;
}

          <div style="font-family:var(--font-mono);font-size:16px;">${c.sb.toFixed(1)}</div>

      </div>

  }).join('') + (cards.length > 150 ? `<div class="empty-state" style="grid-column:1/-1;"><i class="ti ti-dots"></i>Showing 150 most recent of ${cards.length} matchups. Narrow with the filters above to see more.</div>` : '');

// Maps every drafted player to their draft year (or 'startup'), round, and drafting manager.
// Used by the year/round filter chips. Rounds only reflect rookie drafts, per instructions
// to exclude the startup draft from round filtering (its "rounds" aren't comparable).
function buildPlayerDraftInfo(){
  const info = {};
  const startupSeason = DB.seasons[FIRST_SEASON];
  (DB.startupDraftPicks || []).forEach(p => {
    if(!p.player_id) return;
    info[p.player_id] = {year:'startup', round:null, managerKey: startupSeason ? startupSeason.rosterIdToManagerKey[p.roster_id] : null};
  });
  Object.entries(DB.draftPicks).forEach(([yr, picks]) => {
    const season = DB.seasons[yr];
    (picks || []).forEach(p => {
      if(!p.player_id) return;
      info[p.player_id] = {year:Number(yr), round:p.round, managerKey: season ? season.rosterIdToManagerKey[p.roster_id] : null};
    });
  });
  return info;
}

function renderPlayerGraphsPanel(){

function renderPgChart(){
  const draftInfo = buildPlayerDraftInfo();
  const potgLog = computePotgData('all');
  const potgCounts = {}, potwCounts = {};
  potgLog.forEach(e => {
    potgCounts[e.pid] = (potgCounts[e.pid]||0) + 1;
    if(e.type === 'POTW') potwCounts[e.pid] = (potwCounts[e.pid]||0) + 1;
  });

  const agg = {};
  DB.allStarters.forEach(s => {
    if(!agg[s.pid]) agg[s.pid] = {pid:s.pid, starts:0, total:0, best:0};
    agg[s.pid].starts++;
    agg[s.pid].total += (s.points||0);
    if((s.points||0) > agg[s.pid].best) agg[s.pid].best = s.points||0;
  });

  const points = Object.values(agg).map(p => {
    const positions = getPlayerPositions(p.pid, CURRENT_SEASON);
    const di = draftInfo[p.pid];
    return {...p, avg: p.starts ? p.total/p.starts : 0, potg: potgCounts[p.pid]||0, potw: potwCounts[p.pid]||0,
      positions, primaryPos: positions[0] || null, name: (DB.playerMeta[p.pid]||{}).name || p.pid, draftInfo: di};
  }).filter(p => {
    if(p.starts < pgMinStarts) return false;
    if(!p.positions.some(pos => pgPosFilter.has(pos))) return false;
    // Draft year/round/manager filters only exclude players who HAVE a matching draft
    // record that's been deselected — undrafted (FA) players always pass through, since
    // these filters describe draft class membership, not roster membership.
    if(p.draftInfo){
      if(!pgYearFilter.has(p.draftInfo.year)) return false;
      if(p.draftInfo.year !== 'startup' && p.draftInfo.round != null && !pgRoundFilter.has(p.draftInfo.round)) return false;
      if(p.draftInfo.managerKey && !pgMgrFilter.has(p.draftInfo.managerKey)) return false;
    }
    return true;
  });

  const xCalc = PG_METRICS[pgXMetric].calc, yCalc = PG_METRICS[pgYMetric].calc;
  const dataPoints = points.map(p => ({x:xCalc(p), y:yCalc(p), name:p.name, pid:p.pid, color: POSITION_HEX[p.primaryPos] || '#9aa2ad'}));

  const datasets = [{
    label:'Players', data:dataPoints,
    backgroundColor: dataPoints.map(p => p.color),
    pointRadius:4, pointHoverRadius:6
  }];

  const xs = dataPoints.map(p=>p.x), ys = dataPoints.map(p=>p.y);
  const xMin = Math.min(...xs, 0), xMax = Math.max(...xs, 1);
  const overlayLabels = [];

  if(pgShowXMean && xs.length){
    const meanX = xs.reduce((a,b)=>a+b,0)/xs.length;
    const yMin = Math.min(...ys, 0), yMax = Math.max(...ys, 1);
    datasets.push({type:'line', label:'X Mean', data:[{x:meanX,y:yMin},{x:meanX,y:yMax}], borderColor:'#e0503f', borderWidth:1.5, borderDash:[5,4], pointRadius:0, fill:false});
    overlayLabels.push(`<span style="color:#e0503f;">X Mean: ${fmtNum(meanX)}</span>`);
  }
  if(pgShowYMean && ys.length){
    const meanY = ys.reduce((a,b)=>a+b,0)/ys.length;
    datasets.push({type:'line', label:'Y Mean', data:[{x:xMin,y:meanY},{x:xMax,y:meanY}], borderColor:'#3f83c9', borderWidth:1.5, borderDash:[5,4], pointRadius:0, fill:false});
    overlayLabels.push(`<span style="color:#3f83c9;">Y Mean: ${fmtNum(meanY)}</span>`);
  }

  const overlayLabelEl = document.getElementById('pg-overlay-label');
  if(pgShowR2 && xs.length > 1){
    // Simple least-squares linear regression
    const n = xs.length;
    const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
    const sumXY = xs.reduce((a,x,i)=>a+x*ys[i],0), sumXX = xs.reduce((a,x)=>a+x*x,0);
    const denom = (n*sumXX - sumX*sumX);
    if(denom !== 0){
      const slope = (n*sumXY - sumX*sumY) / denom;
      const intercept = (sumY - slope*sumX) / n;
      const meanY2 = sumY/n;
      const ssTot = ys.reduce((a,y)=>a+(y-meanY2)**2,0);
      const ssRes = ys.reduce((a,y,i)=>a+(y-(slope*xs[i]+intercept))**2,0);
      const r2 = ssTot ? 1 - (ssRes/ssTot) : 0;
      datasets.push({type:'line', label:'Trendline', data:[{x:xMin,y:slope*xMin+intercept},{x:xMax,y:slope*xMax+intercept}], borderColor:'#e8823a', borderWidth:2, pointRadius:0, fill:false});
      overlayLabels.push(`<span style="color:#e8823a;">R\u00b2 = ${r2.toFixed(3)} (n=${n})</span>`);
    }
  }
  if(overlayLabelEl) overlayLabelEl.innerHTML = overlayLabels.join('');

  if(DB.charts['pg']) DB.charts['pg'].destroy();
  const ctx = document.getElementById('pg-canvas');
  if(!ctx) return;
  DB.charts['pg'] = new Chart(ctx, {
    type:'scatter',
    data:{datasets},
    options:{
      responsive:true,
      plugins:{
        legend:{display:false},
        tooltip:{filter: (item) => item.datasetIndex===0, callbacks:{label:(c) => `${c.raw.name}: (${fmtNum(c.raw.x)}, ${fmtNum(c.raw.y)})`}}
      },
      scales:{
        x:{title:{display:true, text:PG_METRICS[pgXMetric].label, color:'#9aa2ad'}, ticks:{color:'#9aa2ad'}, grid:{color:'#1a1e24'}},
        y:{title:{display:true, text:PG_METRICS[pgYMetric].label, color:'#9aa2ad'}, ticks:{color:'#9aa2ad'}, grid:{color:'#1a1e24'}}
      },
      onClick:(evt, elements) => {
        const hit = elements.find(el => el.datasetIndex === 0);
        if(hit) openPlayerModal(dataPoints[hit.index].pid);
      }
    }
  });
}

   PROJECTIONS
   Actual vs. projected scoring, at both the player and manager level.
   Only meaningful for 2020+ seasons (see loadSeasonScoring).

/* ============================================================
   PROJECTIONS — LUCK ANALYSIS
   A "lucky win" is a matchup where the winner's team had a LOWER combined
   projection than the loser's team but won anyway; an "unlucky loss" is
   the same event, framed from the losing side. Skips weeks where either
   team's projected total is under 5 (usually missing-data weeks, not
   meaningful projections).
   ============================================================ */
function computeLuckGames(){
  const lucky = [], unlucky = [];
  Object.entries(DB.seasons).forEach(([yearStr, season]) => {
    const year = Number(yearStr);
    Object.entries(season.matchupsByWeek || {}).forEach(([wStr, mus]) => {
      const week = Number(wStr);
      const byId = {};
      mus.forEach(m => { (byId[m.matchup_id] = byId[m.matchup_id] || []).push(m); });
      Object.values(byId).forEach(pair => {
        if(pair.length < 2) return;
        const [a,b] = pair;
        const projFor = (rid) => DB.allStarters
          .filter(s => s.year===year && s.week===week && s.teamRosterId===rid && s.projected != null)
          .reduce((sum,s) => sum + (s.projected||0), 0);
        const aProj = projFor(a.roster_id), bProj = projFor(b.roster_id);
        if(aProj < 5 || bProj < 5) return;
        const aAct = getTeamComputedTotal(a), bAct = getTeamComputedTotal(b);
        const ka = season.rosterIdToManagerKey[a.roster_id], kb = season.rosterIdToManagerKey[b.roster_id];
        const aWon = aAct > bAct;
        const game = {
          year, week,
          winner: aWon?ka:kb, loser: aWon?kb:ka,
          winAct: aWon?aAct:bAct, loseAct: aWon?bAct:aAct,
          winProj: aWon?aProj:bProj, loseProj: aWon?bProj:aProj
        };
        if(game.winProj < game.loseProj) lucky.push(game);
        else if(game.winProj > game.loseProj) unlucky.push(game);
      });
    });
  });
  lucky.sort((a,b) => (b.loseProj-b.winProj) - (a.loseProj-a.winProj));
  unlucky.sort((a,b) => (b.winProj-b.loseProj) - (a.winProj-a.loseProj));
  return {lucky, unlucky};
}

function renderLuckRundown(){
  const {lucky} = computeLuckGames();
  const fmtLucky = g => `<div class="card" style="margin-bottom:8px;border-left:3px solid var(--good);">
    <div style="font-size:10px;color:var(--good);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px;">Lucky Win</div>
    <div style="font-size:13px;">${(getManager(g.winner)||{}).name||g.winner} def. ${(getManager(g.loser)||{}).name||g.loser} (${fmtNum(g.winAct)}\u2013${fmtNum(g.loseAct)})</div>
    <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${seasonLabel(g.year)} Wk ${g.week} \u00b7 Projected: ${fmtNum(g.winProj)} vs ${fmtNum(g.loseProj)}</div>
  </div>`;

  return `
    <h3 style="margin-bottom:10px;">Lucky Wins</h3>
    <div style="margin-bottom:26px;">${lucky.slice(0,10).map(fmtLucky).join('') || '<div class="empty-state" style="padding:16px;">No data yet.</div>'}</div>
  `;
}

        </tr>`).join('')}</tbody>

/* ============================================================
   ALL-TIME DRAFT POINTS LEADERBOARD
   Pts/starts scored by draftees FOR the team that drafted them — mirrors
   football's reference table. A toggle chip includes/excludes the startup
   draft from the aggregation.
   ============================================================ */
let draftLbSort = {col:'pts', dir:-1};
let draftLbIncludeStartup = true;

function toggleDraftLbStartup(el){
  draftLbIncludeStartup = !draftLbIncludeStartup;
  el.classList.toggle('active');
  renderDraftLeaderboard();

function sortDraftLbTable(col){

function computeDraftLeaderboard(includeStartup){
  const agg = {};
  Object.keys(MANAGERS).forEach(k => { agg[k] = {picks:0, starts:0, pts:0}; });

  const processPicks = (picks, season) => {
    (picks || []).forEach(p => {
      if(!p.player_id) return;
      const managerKey = season ? season.rosterIdToManagerKey[p.roster_id] : null;
      if(!managerKey || !agg[managerKey]) return;
      agg[managerKey].picks++;
      const myStarts = DB.allStarters.filter(s => s.pid === p.player_id && s.managerKey === managerKey);
      agg[managerKey].starts += myStarts.length;
      agg[managerKey].pts += myStarts.reduce((a,b) => a+(b.points||0), 0);
    });
  };

  if(includeStartup) processPicks(DB.startupDraftPicks, DB.seasons[FIRST_SEASON]);
  Object.entries(DB.draftPicks).forEach(([yr, picks]) => processPicks(picks, DB.seasons[yr]));

  return Object.entries(agg).map(([k,d]) => ({k, ...d, ptsPerStart: d.starts ? d.pts/d.starts : 0}));
}

/* ============================================================
   PLAYER ACQUISITION / AWARDS HELPERS
   Used by the player card. Adapted to basketball's data shapes and
   reduced awards profile (no MVP, Docile Cup MVP, or Pro Bowl —
   just championships, All-Docile tiers, All-Rookie, and POTG/POTW).
   ============================================================ */
function getPlayerAcquisition(pid){
  for(const [yr, picks] of Object.entries(DB.draftPicks)){
    const p = (picks||[]).find(pk => String(pk.player_id) === String(pid));
    if(p){
      const season = DB.seasons[yr];
      const mgrKey = season ? season.rosterIdToManagerKey[p.roster_id] : null;
      const mgrName = (getManager(mgrKey)||{}).name || mgrKey || '?';
      return {type:'Draft', label:`${seasonLabel(Number(yr))} Draft \u00b7 Rd ${p.round}, Pick ${p.pick_no} \u00b7 ${mgrName}`};
    }
  }
  const su = (DB.startupDraftPicks || []).find(pk => String(pk.player_id) === String(pid));
  if(su){
    const season = DB.seasons[FIRST_SEASON];
    const mgrKey = season ? season.rosterIdToManagerKey[su.roster_id] : null;
    const mgrName = (getManager(mgrKey)||{}).name || mgrKey || '?';
    return {type:'Startup', label:`${seasonLabel(FIRST_SEASON)} Startup Draft \u00b7 Rd ${su.round}, Pick ${su.pick_no} \u00b7 ${mgrName}`};
  }
  const hasStarts = DB.allStarters.some(s => String(s.pid) === String(pid));
  if(hasStarts) return {type:'FA', label:'FA (free agent) \u2014 not drafted'};
  return null;
}

function computePlayerAwards(pid){
  const awards = [];

  // Championships — 🏆 repeated per title, with the actual years won
  const champYears = [];
  Object.entries(FINAL_STANDINGS).forEach(([yr, f]) => {
    const year = Number(yr);
    const season = DB.seasons[year];
    if(!season) return;
    const champTeam = (season.teams||[]).find(t => t.managerKey === f.champion);
    if(!champTeam) return;
    const started = DB.allStarters.some(s => s.pid===pid && s.year===year && s.teamRosterId===champTeam.rosterId);
    if(started) champYears.push(seasonLabel(year));
  });
  if(champYears.length) awards.push({emoji: '\u{1F3C6}'.repeat(champYears.length), line:`Docile Champion (${champYears.join(', ')})`}); // 🏆

  // All-Docile tiers — medal emoji repeated per occurrence, with the actual years won
  const tierEmoji = {1:'\u{1F947}', 2:'\u{1F948}', 3:'\u{1F949}'}; // 🥇🥈🥉
  const tierLabel = {1:'All-Docile 1st Team', 2:'All-Docile 2nd Team', 3:'All-Docile 3rd Team'};
  [1,2,3].forEach(tier => {
    const yrs = [];
    Object.entries(DB.awards.allDocile).forEach(([yr, teams]) => {
      const roster = (teams && teams[tier]) || [];
      if(roster.some(r => r.pid === pid)) yrs.push(seasonLabel(Number(yr)));
    });
    if(yrs.length) awards.push({emoji: tierEmoji[tier].repeat(yrs.length), line:`${tierLabel[tier]} (${yrs.join(', ')})`});
  });

  // All-Rookie — 👶 repeated per occurrence, with the actual year(s) won
  const rookieYrs = [];
  Object.entries(DB.awards.allRookie).forEach(([yr, teams]) => {
    const roster = (teams && teams[1]) || [];
    if(roster.some(r => r.pid === pid)) rookieYrs.push(seasonLabel(Number(yr)));
  });
  if(rookieYrs.length) awards.push({emoji: '\u{1F476}'.repeat(rookieYrs.length), line:`All-Rookie Team (${rookieYrs.join(', ')})`}); // 👶

  // POTW/POTG — single emoji + numeric count only. These are weekly (not seasonal) honors
  // that can run high (double digits), so a repeated-emoji-per-occurrence treatment or a
  // full week-by-week list would be excessive here — a count is more readable.
  const allLog = computePotgData('all');
  const potgCount = allLog.filter(e => e.pid === pid).length;
  const potwCount = allLog.filter(e => e.pid === pid && e.type === 'POTW').length;
  if(potwCount) awards.push({emoji: '\u{1F396}\u{FE0F}', line:`POTW (${potwCount})`}); // 🎖️
  if(potgCount) awards.push({emoji: '\u{1F397}\u{FE0F}', line:`POTG (${potgCount})`}); // 🎗️

  return awards;
}

  const total = all.reduce((a,b) => a+(b.points||0), 0);

  const best = all.reduce((a,b) => Math.max(a, b.points||0), 0);

  const positions = getPlayerPositions(pid, CURRENT_SEASON);
  const primaryPos = positions[0] || null;

    bySeason[s.year].starts++;
    bySeason[s.year].managers.add((getManager(s.managerKey)||{}).name || s.managerKey || s.teamName || '?');
  });

  const awards = computePlayerAwards(pid);
  const acq = getPlayerAcquisition(pid);
  const trades = DB.transactions.filter(t => Object.keys(t.adds||{}).includes(pid)).sort((a,b) => b.year-a.year || b.week-a.week);

  content.innerHTML = `
    <h2 style="margin-bottom:2px;text-transform:uppercase;">${meta.name}</h2>

    <div style="font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span>Sleeper ID: <span style="color:var(--text-dim);">${pid}</span></span>
      <button onclick="navigator.clipboard.writeText('${pid}').then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)})"
        style="background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-faint);font-size:10px;padding:2px 7px;cursor:pointer;">Copy</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Total Pts</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${fmtNum(total,0)}</div>
      </div>
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Starts</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${starts}</div>
      </div>
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Avg/Start</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${fmtNum(avg)}</div>
      </div>
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Best Game</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${fmtNum(best)}</div>
      </div>
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">${primaryPos||'Pos'} Rank</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${posRk?'#'+posRk:'—'}</div>
      </div>
      <div class="card" style="padding:10px;text-align:center;">
        <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Overall Rank</div>
        <div style="font-size:19px;font-weight:700;color:var(--accent);">${overallRk?'#'+overallRk:'—'}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Notes</div>
      <div style="font-style:italic;color:var(--text-faint);font-size:12.5px;">No notes yet.</div>
    </div>

    ${acq ? `<div class="card" style="margin-bottom:12px;">
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Acquired via</div>
      <div style="font-size:13px;font-weight:600;">${acq.label}</div>
    </div>` : ''}

    ${awards.length ? `<div style="margin-bottom:14px;">
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">League Awards &amp; Honors</div>
      ${awards.map(a => `<div style="padding:5px 0;font-size:13px;line-height:1.7;display:flex;align-items:flex-start;gap:8px;">
        ${a.icon ? `<i class="ti ${a.icon}" style="color:var(--gold);flex-shrink:0;margin-top:2px;"></i>` : ''}
        <span>${a.emoji ? `<span style="word-break:break-all;">${a.emoji}</span> ` : ''}${a.line}</span>
      </div>`).join('')}
    </div>` : ''}

    ${trades.length ? `<div style="margin-bottom:14px;">
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Trade History</div>
      ${trades.map(t => {
        const season = DB.seasons[t.year];
        const destRid = t.adds[pid];
        const [r1, r2] = t.roster_ids || [0,0];
        const srcRid = destRid === r1 ? r2 : r1;
        const destMgr = season ? season.rosterIdToManagerKey[destRid] : null;
        const srcMgr = season ? season.rosterIdToManagerKey[srcRid] : null;
        return `<div style="background:var(--bg-hover);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;margin-bottom:4px;">
          <span style="color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;">${seasonLabel(t.year)} Wk ${t.week}</span>
          <span style="margin:0 6px;color:var(--text-faint);">\u00b7</span>
          <span>${(getManager(srcMgr)||{}).name||srcMgr||'?'}</span>
          <span style="margin:0 5px;color:var(--accent);">\u2192</span>
          <strong>${(getManager(destMgr)||{}).name||destMgr||'?'}</strong>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div>
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Season Breakdown</div>
      <table class="data-table">
        <thead><tr><th>Season</th><th>Starts</th><th>Total</th><th>Avg</th><th>Manager(s)</th></tr></thead>
        <tbody>${Object.entries(bySeason).sort((a,b) => b[0]-a[0]).map(([yr,d]) => `<tr>
          <td>${seasonLabel(Number(yr))}</td>
          <td>${d.starts}</td>
          <td>${fmtNum(d.pts)}</td>
          <td>${fmtNum(d.pts/d.starts)}</td>
          <td style="font-size:11.5px;color:var(--text-dim);">${[...d.managers].join(', ')}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;
  overlay.classList.add('active');
}
document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('active');
});
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') document.getElementById('modal-overlay').classList.remove('active');
});

/* ============================================================
   SIGN-IN / MANAGER ROUTING
   Matches the entered username against the known MANAGERS roster
   (case-insensitive, resolving known aliases like GelEBeans -> CarlCanary)
   rather than hitting Sleeper's /user endpoint — this is a closed
   12-person league, so membership in our own roster IS the identity
   check that matters here, and it costs zero extra API calls.
   ============================================================ */
function resolveManagerFromUsername(rawUsername){
  if(!rawUsername) return null;
  const lower = rawUsername.toLowerCase();
  const directKey = Object.keys(MANAGERS).find(k => k.toLowerCase() === lower);
  if(directKey) return directKey;
  const aliasKey = Object.keys(USERNAME_ALIASES).find(k => k.toLowerCase() === lower);
  if(aliasKey) return USERNAME_ALIASES[aliasKey];
  return null;
}

function setSetupStatus(msg, isError=false){
  const el = document.getElementById('setup-status');
  el.textContent = msg;
  el.classList.toggle('error', isError);
}
function setSetupProgress(pct){
  document.getElementById('prog-fill').style.width = `${pct}%`;
}

async function startArchiveLoad(guest=false){
  const btn = document.getElementById('btn-load');
  const username = guest ? '' : document.getElementById('inp-user').value.trim();

  if(CF_WORKER_URL.includes('YOUR-WORKER')){
    setSetupStatus('CF_WORKER_URL is still a placeholder — set it to your deployed Cloudflare Worker.', true);
    return;
  }

  btn.disabled = true;
  DB.myUsername = username || null;
  DB.myManagerKey = username ? resolveManagerFromUsername(username) : null;

  if(username && !DB.myManagerKey){
    setSetupStatus(`"${username}" isn't a recognized Fellowship manager — continuing without My Team personalization.`);
  } else {
    setSetupStatus('Loading the archive…');
  }
  setSetupProgress(5);

  try{
    await loadAllData((pct, msg) => { setSetupProgress(pct); if(msg) setSetupStatus(msg); });
    DB.loaded = true;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAll();
  }catch(e){
    console.error('Data load failed:', e);
    setSetupStatus('Error loading the archive: ' + e.message, true);
    btn.disabled = false;
  }
}

// The actual Sleeper data pipeline, extracted from the old init() so it can report
// progress back to the sign-in screen. onProgress(pct, message) fires at each major step.
async function loadAllData(onProgress = () => {}){
  onProgress(10, 'Loading season data…');
  await loadAllSeasons();

  onProgress(30, 'Loading player pool…');
  await loadPlayerPool();
  buildPlayerNameMap();

  onProgress(50, 'Loading draft picks…');
  await loadAllDraftPicks();
  await loadStartupDraft();

  const years = Object.keys(LEAGUE_IDS).map(Number).filter(y => y < CURRENT_SEASON);
  for(let i=0; i<years.length; i++){
    const y = years[i];
    onProgress(55 + Math.round((i/years.length)*40), `Loading ${seasonLabel(y)} scoring… (${i+1}/${years.length})`);
    await loadSeasonScoring(y);
    await loadTransactions(y);
    await loadPlayoffData(y);
    buildHonorsForYear(y);
  }
  onProgress(100, '');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inp-user').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') startArchiveLoad();
  });
});
</script>
