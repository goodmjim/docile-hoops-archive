<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0b0d10;
  --bg-elevated:#12151a;
  --bg-panel:#161a20;
  --bg-hover:#1d222a;
  --border:#232830;
  --border-soft:#1a1e24;
  --text:#e7e9ec;
  --text-dim:#9aa2ad;
  --text-faint:#5f6772;

  --accent:#e8823a;       /* fellowship orange — signature color */
  --accent-dim:#c96b28;
  --accent-soft:rgba(232,130,58,0.14);

  --gold:#d8b04a;         /* champion trophy gold */
  --good:#3fb673;
  --bad:#d9534f;

  /* position colors */
  --pos-pg:#e0503f;
  --pos-sg:#e08a2f;
  --pos-sf:#3fae5c;
  --pos-pf:#3f83c9;
  --pos-c:#9a5fc9;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;

  --font-display:'Rajdhani','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Consolas',monospace;

  --sidebar-w:230px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0 0 .5em;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   SIGN-IN GATE
   ============================================================ */
#setup{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at top, rgba(232,130,58,0.08), transparent 60%), var(--bg);
}
.setup-box{
  width:100%;max-width:400px;
  background:var(--bg-elevated);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:32px 28px;
}
.setup-logo{text-align:center;margin-bottom:28px;}
.setup-logo i{font-size:36px;color:var(--accent);}
.setup-logo h1{font-size:22px;line-height:1.25;margin:10px 0 6px;}
.setup-logo p{color:var(--text-faint);font-size:12.5px;margin:0;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:6px;}
.fg input{
  width:100%;padding:10px 14px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--bg-panel);
  color:var(--text);
  font-size:14px;
}
.fg input:focus{outline:none;border-color:var(--accent-dim);}
.btn-load{
  width:100%;padding:11px;
  background:var(--accent);
  color:#1a0f05;
  border:none;border-radius:var(--radius-md);
  font-weight:700;font-size:14px;
  margin-bottom:8px;
}
.btn-load:hover{background:var(--accent-dim);}
.btn-guest{
  width:100%;padding:9px;
  background:transparent;
  color:var(--text-faint);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  font-size:12.5px;
}
.btn-guest:hover{color:var(--text-dim);border-color:var(--text-faint);}
#setup-status{
  font-size:12.5px;
  color:var(--text-dim);
  text-align:center;
  margin-top:14px;
  min-height:16px;
}
#setup-status.error{color:var(--bad);}
.prog-track{
  height:4px;border-radius:2px;
  background:var(--bg-panel);
  overflow:hidden;
  margin-top:6px;
}
.prog-fill{height:100%;width:0%;background:var(--accent);transition:width .25s ease;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{display:flex;min-height:100vh;}

/* --- Desktop sidebar --- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
#sidebar .brand{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border-soft);
}
#sidebar .brand .mark{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
}
#sidebar .brand .mark i{color:var(--accent);font-size:20px;}
#sidebar .brand .sub{font-size:11px;color:var(--text-faint);margin-top:3px;letter-spacing:.04em;text-transform:uppercase;}

.nav-section{padding:14px 10px 4px;}
.nav-section .nav-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--text-faint);
  padding:0 10px 6px;
  font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.5px;
  cursor:pointer;
  transition:background .12s,color .12s;
  white-space:nowrap;
}
.nav-item i{font-size:17px;width:18px;text-align:center;flex-shrink:0;}
.nav-item:hover{background:var(--bg-hover);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}

/* --- Main content --- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:none;
  padding:14px 20px;
  border-bottom:1px solid var(--border-soft);
  align-items:center;
  justify-content:space-between;
}
#content{flex:1;padding:24px 28px 100px;max-width:1400px;width:100%;margin:0 auto;}

.panel{display:none;}
.panel.active{display:block;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel-header{margin-bottom:20px;}
.panel-header h1{font-size:24px;}
.panel-header .desc{color:var(--text-dim);font-size:13px;}

/* --- Bottom nav (mobile) --- */
#bottomnav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-elevated);
  border-top:1px solid var(--border-soft);
  z-index:50;
}
#bottomnav .bn-main{
  display:flex;
}
#bottomnav .bn-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;
  color:var(--text-faint);
  font-size:10px;
}
#bottomnav .bn-item i{font-size:20px;}
#bottomnav .bn-item.active{color:var(--accent);}
#bottomnav .bn-subrow{
  display:flex;
  gap:8px;
  padding:8px 12px;
  overflow-x:auto;
  border-top:1px solid var(--border-soft);
}
.yr-chip{
  flex-shrink:0;
  padding:6px 12px;
  border-radius:999px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .12s;
}
.yr-chip.active{background:var(--accent);border-color:var(--accent);color:#1a0f05;}
.yr-chip:hover:not(.active){border-color:var(--accent-dim);color:var(--text);}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.card{
  background:var(--bg-panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:16px;
}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{
  text-align:left;
  padding:9px 10px;
  color:var(--text-faint);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
table.data-table th:hover{color:var(--text);}
table.data-table th .sort-arrow{opacity:.4;margin-left:3px;font-size:10px;}
table.data-table th.sorted .sort-arrow{opacity:1;color:var(--accent);}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
table.data-table tbody tr:hover{background:var(--bg-hover);}

/* position badges */
.pos-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:20px;padding:0 6px;
  border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;
  color:#0b0d10;
}
.pos-badge.pos-pg{background:var(--pos-pg);}
.pos-badge.pos-sg{background:var(--pos-sg);}
.pos-badge.pos-sf{background:var(--pos-sf);}
.pos-badge.pos-pf{background:var(--pos-pf);}
.pos-badge.pos-c{background:var(--pos-c);}
.pos-badge.pos-split{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.pos-badge.pos-multi{background:var(--bg-hover);color:var(--text-dim);border:1px solid var(--border);}

.player-link{cursor:pointer;color:var(--accent);text-decoration:none;position:relative;}
.player-link:hover{text-decoration:underline;text-decoration-color:var(--accent-dim);text-underline-offset:3px;}
.player-link::after{
  content:'View card';position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-dim);
  font-size:10.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.player-link:hover::after{opacity:1;}
@media (max-width:880px){
  .player-link{display:inline-flex;align-items:center;gap:3px;}
  .player-link::before{content:'\2197';font-size:10px;color:var(--accent);opacity:.7;order:2;}
  .player-link::after{display:none;}
}

.trophy-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(216,176,74,0.12);
  border:1px solid rgba(216,176,74,0.35);
  color:var(--gold);
  padding:3px 9px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:600;
}
.trophy-chip i{font-size:13px;}

.timeline-rail{position:relative;padding-left:30px;max-width:640px;}
.timeline-rail::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border);}
.timeline-item{position:relative;margin-bottom:20px;}
.timeline-dot{position:absolute;left:-30px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--bg-panel);border:2px solid var(--border);}
.timeline-dot.champ{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,176,74,0.15);}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--text-faint);
}
.empty-state i{font-size:34px;display:block;margin-bottom:10px;opacity:.5;}

.loading-state{
  text-align:center;padding:40px;color:var(--text-faint);font-size:13px;
}

/* Modal */
#modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow-y:auto;
}
#modal-overlay.active{display:flex;}
#modal-box{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  max-width:640px;width:100%;
  padding:22px;
  position:relative;
}
#modal-close{
  position:absolute;top:14px;right:14px;
  background:var(--bg-hover);border:1px solid var(--border);
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);
}
#modal-close:hover{color:var(--text);}

/* Responsive */
@media (max-width:880px){
  #sidebar{display:none;}
  #topbar{display:flex;}
  #content{padding:16px 16px 140px;}
  #bottomnav{display:block;}
  /* Opt-in: apply .table-scroll-min to a table (only when its wrapper div already has
     overflow-x:auto) to force real horizontal scrolling instead of columns cramming
     down to unreadable widths. NOT applied globally — many tables aren't wrapped yet. */
  table.data-table.table-scroll-min{min-width:480px;}
}
</style>
</head>

</div>

<div id="app" style="display:none;">

</div>

/* ============================================================
   POTG / POTW
   Computed ON DEMAND from season.matchupsByWeek, mirroring the football archive's
   computePotgData() pattern rather than caching into DB — always in sync, no
   invalidation to worry about. Reads DB.allStarters as a fallback points source
   exactly like football does, for the rare case players_points is missing.

   Basketball-specific rules confirmed in-thread (these DIFFER from football's
   simpler "just take the single highest score" logic):
   - 6 POTG/week (1 per matchup), regardless of win/loss.
   - Tie within a matchup -> winning team's player gets it.
   - Tie within a matchup AND both tied players on the winning team -> first in Sleeper's data order.
   - POTW = highest score among the week's POTGs; ties at that top score are SHARED (no winner-team preference at this level).
   - Regular season only — matchupsByWeek only ever contains regular-season weeks (see loadSeasonScoring).
   ============================================================ */
function computePotgData(yearFilter='all'){
  const potgLog = []; // flat log: {pid, week, year, pts, type:'POTG'|'POTW', managerKey, rosterId}
  const years = yearFilter === 'all'
    ? Object.keys(DB.seasons).map(Number)
    : [Number(yearFilter)];

  years.forEach(year => {
    const season = DB.seasons[year];
    if(!season) return;

    Object.entries(season.matchupsByWeek).forEach(([wStr, mus]) => {
      const week = Number(wStr);
      const byMatchup = {};
      mus.forEach(m => { (byMatchup[m.matchup_id] = byMatchup[m.matchup_id] || []).push(m); });

      const weekPotgs = [];
      Object.values(byMatchup).forEach(pair => {
        if(pair.length < 2) return; // needs both sides to determine a winner

        const totals = {};
        pair.forEach(m => { totals[m.roster_id] = getTeamComputedTotal(m); });
        const rosterIds = Object.keys(totals);
        const winningRosterId = totals[rosterIds[0]] >= totals[rosterIds[1]] ? rosterIds[0] : rosterIds[1];

        const candidates = [];
        pair.forEach(m => {
          const managerKey = season.rosterIdToManagerKey[m.roster_id];
          const ppts = m.players_points || {};
          (m.starters || []).forEach(pid => {
            if(!pid || pid === '0') return;
            const pts = ppts[pid] ?? DB.allStarters.find(e => e.pid===pid && e.week===week && e.year===year)?.points ?? null;
            if(pts === null) return;
            candidates.push({pid, pts, rosterId:m.roster_id, managerKey});
          });
        });
        if(!candidates.length) return;

        const maxScore = Math.max(...candidates.map(c => c.pts));
        let tied = candidates.filter(c => c.pts === maxScore);
        if(tied.length > 1){
          const onWinningTeam = tied.filter(c => String(c.rosterId) === String(winningRosterId));
          tied = onWinningTeam.length ? [onWinningTeam[0]] : [tied[0]]; // first-in-data-order fallback
        }
        weekPotgs.push({...tied[0], week, year, type:'POTG'});
      });

      potgLog.push(...weekPotgs);

      // POTW: highest score among this week's POTGs — SHARED on exact ties (unlike POTG, no winner-team tiebreak here)
      if(weekPotgs.length){
        const topScore = Math.max(...weekPotgs.map(p => p.pts));
        weekPotgs.filter(p => p.pts === topScore).forEach(p => { p.type = 'POTW'; });
      }
    });
  });

  return potgLog;
}

/* ============================================================
   ALL-DOCILE / ALL-ROOKIE TEAM CONSTRUCTION
   Deterministic scarcity-fill (not a true optimal assignment solve) — chosen for
   transparency: rarest-eligibility slot fills first so a highest scorer is never
   blocked out by a flex slot absorbing them earlier. See in-thread discussion.
   Season totals = sum of STARTER points only, regular season only.
   ============================================================ */
const FLEX_FILL_ORDER = ['C','PF','SF','PG','SG','F','G','UTIL','UTIL','UTIL'];
const ROOKIE_FILL_ORDER = ['C','PF','SF','PG','SG'];

// Aggregates lineup points per player for a season — mirrors the football archive's
// renderPlayers() aggregation, filtering the flat DB.allStarters array by year rather
// than reading from a nested per-week cache.
function computeSeasonTotals(year){
  const totals = {}; // pid -> points
  DB.allStarters.filter(s => s.year === year).forEach(s => {
    totals[s.pid] = (totals[s.pid] || 0) + (s.points || 0);
  });
  return totals;
}

function getPlayerPositions(pid, year){
  const meta = DB.playerMeta[pid];
  if(!meta) return [];
  return meta.positionsBySeasonYear[year] || meta.positionsBySeasonYear[CURRENT_SEASON] || [];
}

function isEligibleForSlot(pid, slot, year){
  const positions = getPlayerPositions(pid, year);
  return positions.some(p => SLOT_ELIGIBILITY[slot].includes(p));
}

// resolves which single true-position color/label to credit a player with when placed in a flex slot,
// preferring the position that actually satisfies that slot
function resolvePositionForSlot(pid, slot, year){
  const positions = getPlayerPositions(pid, year);
  const match = positions.find(p => SLOT_ELIGIBILITY[slot].includes(p));
  return match || positions[0] || slot;
}

function buildAllDocileTeams(year){
  const totals = computeSeasonTotals(year);
  let pool = Object.keys(totals)
    .filter(pid => totals[pid] > 0)
    .sort((a,b) => totals[b]-totals[a]);

  const teams = {};
  [1,2,3].forEach(teamNum => {
    const roster = [];
    FLEX_FILL_ORDER.forEach(slot => {
      const idx = pool.findIndex(pid => isEligibleForSlot(pid, slot, year));
      if(idx === -1){ roster.push({slot, pid:null, points:0}); return; }
      const pid = pool[idx];
      roster.push({slot, pid, points:totals[pid], resolvedPosition:resolvePositionForSlot(pid, slot, year)});
      pool.splice(idx,1);
    });
    teams[teamNum] = roster;
  });
  DB.awards.allDocile[year] = teams;
  return teams;
}

// Rookie status: a player counts as a rookie for `year` if they were selected in that
// year's rookie draft (ROOKIE_DRAFT_IDS[year]). This is a proxy for actual NBA rookie
// status — accurate for the vast majority of cases, but a late draft-and-stash pick who
// debuts a year after being drafted would be misattributed. Flag if that needs refining.
function getRookiePidsForYear(year){
  const picks = DB.draftPicks[year] || [];
  return new Set(picks.map(p => p.player_id));
}

function buildAllRookieTeam(year){
  const totals = computeSeasonTotals(year);
  const rookiePids = getRookiePidsForYear(year);
  let pool = Object.keys(totals)
    .filter(pid => totals[pid] > 0 && rookiePids.has(pid))
    .sort((a,b) => totals[b]-totals[a]);

  // Only one All-Rookie team is honored (unlike All-Docile's three tiers) —
  // rookie classes are too shallow to support meaningful 2nd/3rd teams.
  const roster = [];
  ROOKIE_FILL_ORDER.forEach(slot => {
    const idx = pool.findIndex(pid => isEligibleForSlot(pid, slot, year));
    if(idx === -1){ roster.push({slot, pid:null, points:0}); return; }
    const pid = pool[idx];
    roster.push({slot, pid, points:totals[pid], resolvedPosition:slot});
    pool.splice(idx,1);
  });
  const teams = {1: roster};
  DB.awards.allRookie[year] = teams;
  return teams;
}

function buildHonorsForYear(year){
  buildAllDocileTeams(year);
  buildAllRookieTeam(year);
}

/* ============================================================
   ALL-TIME AGGREGATION HELPERS
   Used by the Dashboard's automated insights and the Weekly Recap.
   Reads directly from each season's `teams` array (wins/losses/pf/pa,
   already computed by loadSeason from roster settings) and from
   matchupsByWeek for head-to-head records.
   ============================================================ */
function computeAllTimeManagerRecords(){
  const agg = {}; // managerKey -> {wins, losses, pf, pa}
  Object.values(DB.seasons).forEach(season => {
    (season.teams || []).forEach(t => {
      if(!t.managerKey) return;
      if(!agg[t.managerKey]) agg[t.managerKey] = {wins:0, losses:0, pf:0, pa:0};
      agg[t.managerKey].wins += t.wins;
      agg[t.managerKey].losses += t.losses;
      agg[t.managerKey].pf += t.pf;
      agg[t.managerKey].pa += t.pa;
    });
  });
  return agg;
}

// Tallies win/loss/PF/PA per manager directly from regular-season matchup data (not
// Sleeper's official roster.settings totals, which computeAllTimeManagerRecords uses and
// which include playoff results). This self-consistent reconstruction is what powers the
// Standings rank-change indicator below — `excludeYear`/`excludeWeek` lets us compute
// "standings as of last week" by omitting just the most recent week's games.
// NOTE: because this omits playoffs (matchupsByWeek only ever holds regular-season weeks),
// the rank shown here can occasionally diverge slightly from the official all-time
// standings columns for a season where playoffs have already been played.
function computeStandingsFromMatchups(excludeYear=null, excludeWeek=null){
  const records = {};
  Object.entries(DB.seasons).forEach(([yearStr, season]) => {
    const year = Number(yearStr);
    Object.entries(season.matchupsByWeek || {}).forEach(([wStr, mus]) => {
      const week = Number(wStr);
      if(year===excludeYear && week===excludeWeek) return;
      const byId = {};
      mus.forEach(m => { (byId[m.matchup_id] = byId[m.matchup_id] || []).push(m); });
      Object.values(byId).forEach(pair => {
        if(pair.length < 2) return;
        const [a,b] = pair;
        const ka = season.rosterIdToManagerKey[a.roster_id], kb = season.rosterIdToManagerKey[b.roster_id];
        const pa = getTeamComputedTotal(a), pb = getTeamComputedTotal(b);
        if(!records[ka]) records[ka] = {wins:0, losses:0, pf:0, pa:0};
        if(!records[kb]) records[kb] = {wins:0, losses:0, pf:0, pa:0};
        records[ka].pf += pa; records[ka].pa += pb;
        records[kb].pf += pb; records[kb].pa += pa;
        const aWon = pa >= pb;
        if(aWon){ records[ka].wins++; records[kb].losses++; }
        else{ records[kb].wins++; records[ka].losses++; }
      });
    });
  });
  return records;
}

function computeStandingsRankDeltas(){
  let latestYear = null, latestWeek = null;
  Object.entries(DB.seasons).forEach(([yearStr, season]) => {
    const year = Number(yearStr);
    Object.keys(season.matchupsByWeek||{}).forEach(wStr => {
      const week = Number(wStr);
      if(latestYear===null || year>latestYear || (year===latestYear && week>latestWeek)){
        latestYear = year; latestWeek = week;
      }
    });
  });
  if(latestYear===null) return {};

  const afterRecords = computeStandingsFromMatchups();
  const beforeRecords = computeStandingsFromMatchups(latestYear, latestWeek);

  const rankOf = (records) => {
    const ranked = Object.entries(records).sort((a,b) => b[1].wins-a[1].wins || b[1].pf-a[1].pf).map(([k])=>k);
    const idx = {}; ranked.forEach((k,i) => idx[k]=i+1);
    return idx;
  };
  const afterIdx = rankOf(afterRecords), beforeIdx = rankOf(beforeRecords);

  const deltas = {};
  Object.keys(afterIdx).forEach(k => { deltas[k] = (beforeIdx[k] || Object.keys(afterIdx).length+1) - afterIdx[k]; });
  return deltas;
}

// Head-to-head record between two managers across every loaded season's regular-season matchups.
// Single source of truth for head-to-head records — used by both My H2H and League H2H,
// so the two pages can never drift out of sync with each other. Returns a full per-game
// log alongside the win totals. Ties count toward mk1 (matching the >= convention used
// elsewhere in the app, e.g. Weekly Recap results and POTG's winning-team tiebreak) —
// exact ties are vanishingly rare with decimal scoring, but the old version silently
// dropped tied games from BOTH totals instead of counting them, which could undercount
// a manual game-by-game tally.
function computeAllTimeH2H(mk1, mk2){
  const games = [];
  Object.entries(DB.seasons).forEach(([yearStr, season]) => {
    const year = Number(yearStr);
    Object.entries(season.matchupsByWeek || {}).forEach(([wStr, mus]) => {
      const week = Number(wStr);
      const byId = {};
      mus.forEach(m => { (byId[m.matchup_id] = byId[m.matchup_id] || []).push(m); });
      Object.values(byId).forEach(pair => {
        if(pair.length < 2) return;
        const [a, b] = pair;
        const ka = season.rosterIdToManagerKey[a.roster_id];
        const kb = season.rosterIdToManagerKey[b.roster_id];
        const isA1 = ka === mk1, isB1 = kb === mk1;
        const isA2 = ka === mk2, isB2 = kb === mk2;
        if(!((isA1 && isB2) || (isB1 && isA2))) return;
        const aPts = getTeamComputedTotal(a), bPts = getTeamComputedTotal(b);
        const pt1 = isA1 ? aPts : bPts;
        const pt2 = isA2 ? aPts : bPts;
        games.push({year, week, pt1, pt2});
      });
    });
  });
  games.sort((a,b) => b.year-a.year || b.week-a.week);
  const w1 = games.filter(g => g.pt1 >= g.pt2).length;
  const w2 = games.filter(g => g.pt2 > g.pt1).length;
  return {w1, w2, games};
}

/* ============================================================
   AUTOMATED INSIGHTS
   Generates a handful of factual, data-derived cards for the Dashboard.
   Mirrors the football archive's generateInsights() in spirit, scoped to
   what basketball actually has loaded — projection-based insights are
   left out until Projections (Phase 3) is built.
   ============================================================ */
function generateInsights(){
  const cards = [];
  if(!DB.allStarters.length) return cards;

  // All-time league leader (career lineup points, any position)
  const allTimeTotals = {};
  DB.allStarters.forEach(s => { allTimeTotals[s.pid] = (allTimeTotals[s.pid] || 0) + (s.points || 0); });
  const rankedAllTime = Object.entries(allTimeTotals).map(([pid, pts]) => ({pid, pts})).sort((a,b) => b.pts - a.pts);
  if(rankedAllTime[0]){
    const r = rankedAllTime[0];
    const name = (DB.playerMeta[r.pid] || {}).name || `Player ${r.pid}`;
    cards.push({label:'All-Time League Leader', text:`<strong>${name}</strong> leads all-time with <strong>${r.pts.toFixed(1)} lineup pts</strong> across every loaded season.`});
  }

  // Top scorer at each true position, all-time
  TRUE_POSITIONS.forEach(pos => {
    const posRanked = rankedAllTime.filter(r => getPlayerPositions(r.pid, CURRENT_SEASON).includes(pos));
    if(!posRanked.length) return;
    const r = posRanked[0];
    const name = (DB.playerMeta[r.pid] || {}).name || `Player ${r.pid}`;
    cards.push({label:`Top ${pos} All-Time`, text:`<strong>${name}</strong> is the highest-scoring ${pos} in Fellowship history with <strong>${r.pts.toFixed(1)} pts</strong>.`});
  });

  // Best all-time manager record
  const mgrRecords = computeAllTimeManagerRecords();
  const mgrRanked = Object.entries(mgrRecords).map(([k,d]) => ({k, ...d, pct: d.wins/((d.wins+d.losses)||1)})).sort((a,b) => b.wins - a.wins);
  if(mgrRanked[0]){
    const r = mgrRanked[0];
    const name = (getManager(r.k) || {}).name || r.k;
    cards.push({label:'Best All-Time Record', text:`<strong>${name}</strong> leads all managers with <strong>${r.wins}\u2013${r.losses}</strong> (${(r.pct*100).toFixed(0)}% win rate).`});
  }

  // Highest-scoring manager (total PF across all seasons)
  const topPF = [...mgrRanked].sort((a,b) => b.pf - a.pf)[0];
  if(topPF){
    const name = (getManager(topPF.k) || {}).name || topPF.k;
    cards.push({label:'Highest Scoring Manager', text:`<strong>${name}</strong> has scored the most points all-time: <strong>${topPF.pf.toLocaleString(undefined,{maximumFractionDigits:0})}</strong> total.`});
  }

  // Most lopsided rivalry (min 4 head-to-head games)
  const managerKeys = Object.keys(mgrRecords);
  let dominant = null;
  for(let i=0;i<managerKeys.length;i++){
    for(let j=i+1;j<managerKeys.length;j++){
      const h2h = computeAllTimeH2H(managerKeys[i], managerKeys[j]);
      const total = h2h.w1 + h2h.w2;
      if(total < 4) continue;
      const skew = Math.abs(h2h.w1 - h2h.w2) / total;
      if(!dominant || skew > dominant.skew) dominant = {a:managerKeys[i], b:managerKeys[j], ...h2h, skew};
    }
  }
  if(dominant){
    const domKey = dominant.w1 >= dominant.w2 ? dominant.a : dominant.b;
    const subKey = dominant.w1 >= dominant.w2 ? dominant.b : dominant.a;
    const domName = (getManager(domKey) || {}).name || domKey;
    const subName = (getManager(subKey) || {}).name || subKey;
    const domWins = Math.max(dominant.w1, dominant.w2), subWins = Math.min(dominant.w1, dominant.w2);
    cards.push({label:'Most Lopsided Rivalry', text:`<strong>${domName}</strong> dominates <strong>${subName}</strong> head-to-head, <strong>${domWins}\u2013${subWins}</strong> in loaded seasons.`});
  }

  // Highest single-game lineup score, all-time
  const bestGame = [...DB.allStarters].filter(s => s.points != null).sort((a,b) => b.points - a.points)[0];
  if(bestGame){
    const name = (DB.playerMeta[bestGame.pid] || {}).name || `Player ${bestGame.pid}`;
    const mgrName = (getManager(bestGame.managerKey) || {}).name || bestGame.managerKey || '?';
    cards.push({label:'Highest Single-Game Score', text:`<strong>${name}</strong> holds the all-time single-game record: <strong>${bestGame.points.toFixed(2)} pts</strong> in Week ${bestGame.week} of ${seasonLabel(bestGame.year)} for <strong>${mgrName}</strong>.`});
  }

  // Most championships
  const champCounts = {};
  Object.values(FINAL_STANDINGS).forEach(f => { champCounts[f.champion] = (champCounts[f.champion]||0) + 1; });
  const mostChamps = Object.entries(champCounts).sort((a,b) => b[1]-a[1])[0];
  if(mostChamps && mostChamps[1] > 1){
    const name = (getManager(mostChamps[0]) || {}).name || mostChamps[0];
    const years = Object.entries(FINAL_STANDINGS).filter(([,f]) => f.champion === mostChamps[0]).map(([y]) => seasonLabel(Number(y))).join(', ');
    cards.push({label:'Most Championships', text:`<strong>${name}</strong> leads all managers with <strong>${mostChamps[1]} championships</strong> (${years}).`});
  }

  return cards;
}

/* ============================================================
   API FETCH — proxied through Cloudflare Worker
   ============================================================ */
async function apiFetch(path){
  const url = `${CF_WORKER_URL}${path.startsWith('/')?path:'/'+path}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`apiFetch failed [${res.status}] ${path}`);
  return res.json();
}

async function fetchSnapshot(year){
  if(!SNAPSHOT_BASE) return null;
  try{
    const res = await fetch(`${SNAPSHOT_BASE}/${year}.json`);
    if(!res.ok) return null;
    return res.json();
  }catch(e){ return null; }
}

/* ============================================================
   MANAGER / USERNAME / TEAM NAME HELPERS
   ============================================================ */
function resolveUsername(rawUsername){
  return USERNAME_ALIASES[rawUsername] || rawUsername;
}

function getManager(managerKey){
  return MANAGERS[managerKey] || null;
}

function getManagersForYear(year){
  return Object.keys(MANAGERS).filter(k => MANAGERS[k].years.includes(year));
}

function getTeamName(managerKey, year){
  const eras = TEAM_NAMES[managerKey];
  if(!eras) return managerKey;
  const era = eras.find(e => e.years.includes(year));
  if(era) return era.name;
  // 2026 (and any future undefined year) inherits the most recent known era
  const latest = eras.reduce((a,b) => Math.max(...a.years) > Math.max(...b.years) ? a : b);
  return latest.name;
}

function getManagerDisplay(managerKey, year){
  const m = getManager(managerKey);
  return m ? `${getTeamName(managerKey, year)} (${m.name})` : managerKey;
}

// Deterministic "logo" stand-in — initials on a colored circle, since no real team
// logo images are uploaded. Color is hashed from the manager key so it's stable
// across renders rather than randomized each time.
const AVATAR_PALETTE = ['#e0503f','#e08a2f','#3fae5c','#3f83c9','#9a5fc9','#d8b04a','#5fb8b0','#c96b28'];
function getManagerAvatarColor(managerKey){
  let hash = 0;
  const key = managerKey || '?';
  for(let i=0;i<key.length;i++){ hash = (hash*31 + key.charCodeAt(i)) & 0xffffffff; }
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}
function renderManagerAvatar(managerKey, size=44){
  const m = getManager(managerKey);
  const name = m ? m.name : (managerKey || '?');
  const initials = name.slice(0,2).toUpperCase();
  const color = getManagerAvatarColor(managerKey);
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(size*0.38)}px;color:#0b0d10;flex-shrink:0;">${initials}</div>`;
}

/* ============================================================
   POSITION BADGE RENDERING
   ============================================================ */
// Compact badge for tables/cards: single color if one position, hard-stop split if two,
// neutral "multi" badge with text for 3+.
function renderPositionBadge(positions){
  if(!positions || !positions.length) return `<span class="pos-badge pos-multi">–</span>`;
  if(positions.length === 1){
    const p = positions[0];
    return `<span class="pos-badge pos-${p.toLowerCase()}">${p}</span>`;
  }
  if(positions.length === 2){
    const [a,b] = positions;
    const ca = `var(${POSITION_COLORS[a]})`, cb = `var(${POSITION_COLORS[b]})`;
    return `<span class="pos-badge pos-split" style="background:conic-gradient(${ca} 0deg 180deg, ${cb} 180deg 360deg);">${a}/${b}</span>`;
  }
  return `<span class="pos-badge pos-multi">${positions.join('/')}</span>`;
}

// Resolved-color badge for a player placed in a specific lineup slot (shows how they were USED, not eligibility)
function renderSlotBadge(resolvedPosition, slotLabel){
  const p = resolvedPosition;
  return `<span class="pos-badge pos-${p.toLowerCase()}" title="Started at ${slotLabel}">${slotLabel}</span>`;
}

// Per-season eligibility timeline strip for the player modal
function renderEligibilityTimeline(pid){
  const meta = DB.playerMeta[pid];
  if(!meta || !meta.positionsBySeasonYear) return '';
  const years = Object.keys(meta.positionsBySeasonYear).map(Number).sort((a,b)=>a-b);
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;">${years.map(y => `
    <div style="text-align:center;">
      <div style="font-size:10px;color:var(--text-faint);margin-bottom:3px;">${seasonLabel(y)}</div>
      ${renderPositionBadge(meta.positionsBySeasonYear[y])}
    </div>`).join('')}</div>`;
}

// Loads one season's league settings, rosters, and users; resolves aliased usernames
// to canonical MANAGERS keys, and builds a `teams` array (mirrors the football
// archive's shape: rosterId/managerKey/name/wins/losses/pf/pa) alongside a fast
// rosterId -> managerKey lookup map for convenience.
async function loadSeason(year){
  const leagueId = LEAGUE_IDS[year];
  if(!leagueId) return null;

  const [league, rosters, users] = await Promise.all([
    apiFetch(`/league/${leagueId}`),
    apiFetch(`/league/${leagueId}/rosters`),
    apiFetch(`/league/${leagueId}/users`)
  ]);

  const userIdToManagerKey = {};
  users.forEach(u => { userIdToManagerKey[u.user_id] = resolveUsername(u.username || u.display_name); });

  const rosterIdToManagerKey = {};
  rosters.forEach(r => { rosterIdToManagerKey[r.roster_id] = userIdToManagerKey[r.owner_id]; });

  const teams = rosters.map(r => {
    const managerKey = rosterIdToManagerKey[r.roster_id];
    const s = r.settings || {};
    return {
      rosterId: r.roster_id,
      managerKey,
      name: managerKey ? getTeamName(managerKey, year) : `Team ${r.roster_id}`,
      wins: s.wins || 0,
      losses: s.losses || 0,
      pf: (s.fpts || 0) + ((s.fpts_decimal || 0) / 100),
      pa: (s.fpts_against || 0) + ((s.fpts_against_decimal || 0) / 100)
    };
  });

  const seasonData = {
    league, rosters, users, teams,
    userIdToManagerKey, rosterIdToManagerKey,
    playoffWeekStart: league.settings ? league.settings.playoff_week_start : null,
    matchupsByWeek: {}
  };
  DB.seasons[year] = seasonData;
  return seasonData;
}

async function loadAllSeasons(){
  const years = Object.keys(LEAGUE_IDS).map(Number);
  await Promise.all(years.map(y => loadSeason(y)));
}

// Regular-season weeks only (1 .. playoffWeekStart-1) — playoff scoring is excluded
// entirely from player-facing stat tracking per league rules confirmed in-thread.
//
// Scoring source priority mirrors the football archive exactly:
//   1. Sleeper's own matchup.players_points[pid] — most reliable, already respects
//      league scoring_settings AND correctly reflects whichever of the week's two
//      games a manager locked in (Sleeper computes this itself; no special-casing needed).
//   2. Raw stats + league scoring_settings via calcPoints(), when players_points is missing.
//   3. Pre-aggregated pts fields as a last resort.
// Results are pushed into DB.allStarters as a FLAT array (not nested by week), matching
// the football archive's shape — this is what powers leaderboards, POTG, and any
// week-over-week trend views off one shared list.
// Pulls trade transactions over the same regular-season week range as scoring.
// Mirrors the football archive's approach exactly, including its scope limitation:
// only regular-season weeks are covered, so any trade made during a playoff week
// or the pre-week-1 offseason window won't appear here.
async function loadTransactions(year){
  const season = DB.seasons[year];
  if(!season) return;
  const leagueId = LEAGUE_IDS[year];
  const lastRegWeek = (season.playoffWeekStart || 19) - 1;
  const weeks = Array.from({length:lastRegWeek}, (_,i) => i+1);

  const results = await Promise.all(weeks.map(w =>
    apiFetch(`/league/${leagueId}/transactions/${w}`)
      .then(tx => tx.map(t => ({...t, week:w, year})))
      .catch(() => [])
  ));

  const trades = results.flat().filter(t => t.type === 'trade' && t.status === 'complete');
  DB.transactions.push(...trades);
}

// Fetches playoff-week matchups (weeks from playoffWeekStart onward) into a separate
// store from the regular-season-only matchupsByWeek — this data feeds the Playoffs page
// only, and deliberately never touches DB.allStarters/player-stat tracking. We don't know
// the exact number of playoff weeks up front, so we probe a generous range and keep only
// the weeks that actually returned real matchup data.
// Uses Sleeper's own winners_bracket endpoint as the authoritative source of which
// games are real playoff games — this replaces an earlier heuristic that probed a
// fixed window of weeks past playoffWeekStart and guessed based on non-empty starter
// slots, which incorrectly picked up stale/non-game weeks (Sleeper can return non-empty
// starter arrays for weeks where no real game was played). The bracket endpoint only
// ever contains real completed games, so there's nothing to guess.
// Per league rules: the losers bracket is never fetched, and the 3rd-place game
// (p===3 in winners_bracket) plus any bye entries (t1 or t2 null) are filtered out —
// only the true championship-path bracket remains.
async function loadPlayoffData(year){
  const season = DB.seasons[year];
  if(!season || !season.playoffWeekStart) return;
  const leagueId = LEAGUE_IDS[year];

  let bracket = [];
  try{ bracket = await apiFetch(`/league/${leagueId}/winners_bracket`); }catch(e){ bracket = []; }
  bracket = (bracket || []).filter(b => b.p !== 3 && b.t1 != null && b.t2 != null);
  DB.playoffBrackets[year] = bracket;
  DB.playoffMatchupsByWeek[year] = {};
  if(!bracket.length) return;

  const maxRound = Math.max(...bracket.map(b => b.r));
  const weeks = Array.from({length:maxRound}, (_,i) => season.playoffWeekStart + i);

  const results = await Promise.all(weeks.map(w =>
    apiFetch(`/league/${leagueId}/matchups/${w}`).then(mu => ({w, mu})).catch(() => ({w, mu:[]}))
  ));
  results.forEach(({w, mu}) => { DB.playoffMatchupsByWeek[year][w] = mu; });
}

async function loadSeasonScoring(year){
  const season = DB.seasons[year];
  if(!season) return;
  const leagueId = LEAGUE_IDS[year];
  const lastRegWeek = (season.playoffWeekStart || 19) - 1;
  const weeks = Array.from({length:lastRegWeek}, (_,i) => i+1);
  // Projections endpoint confirmed live for NBA, but only fetch for recent seasons —
  // mirrors football's own data-reliability cutoff for projection data.
  const fetchProjections = year >= 2020;

  const [matchupResults, statResults, projResults] = await Promise.all([
    Promise.all(weeks.map(w => apiFetch(`/league/${leagueId}/matchups/${w}`).then(mu=>({w,mu})).catch(()=>({w,mu:[]})))),
    Promise.all(weeks.map(w => apiFetch(`/stats/nba/regular/${year}/${w}`).then(s=>({w,s})).catch(()=>({w,s:{}})))),
    fetchProjections
      ? Promise.all(weeks.map(w => apiFetch(`/projections/nba/regular/${year}/${w}`).then(s=>({w,s})).catch(()=>({w,s:{}}))))
      : Promise.resolve(weeks.map(w => ({w, s:{}})))
  ]);

  const statByWeek = {};
  statResults.forEach(({w,s}) => { statByWeek[w] = s; });
  const projByWeek = {};
  projResults.forEach(({w,s}) => { projByWeek[w] = s; });
  matchupResults.forEach(({w,mu}) => { season.matchupsByWeek[w] = mu; });

  const scoring = season.league.scoring_settings || {};

  matchupResults.forEach(({w,mu}) => {
    mu.forEach(entry => {
      const managerKey = season.rosterIdToManagerKey[entry.roster_id];
      const team = season.teams.find(t => t.rosterId === entry.roster_id);
      const matchupPts = entry.players_points || {};
      (entry.starters || []).forEach(pid => {
        if(!pid || pid === '0') return;
        let points = null;
        if(matchupPts[pid] !== undefined){
          points = matchupPts[pid];
        } else {
          const ps = (statByWeek[w] || {})[pid];
          if(ps){
            points = calcPoints(ps, scoring);
            // pts_ppr/pts_half_ppr are NFL-only (points-per-reception) and don't exist in NBA
            // stat objects — confirmed live: basketball's pre-aggregated field is pts_std.
            if(points === null) points = ps.pts_std ?? null;
          }
        }
        // Projected points — computed from the projections endpoint via the same
        // calcPoints() scoring pipeline as actual points, so they're directly comparable.
        let projected = null;
        const projStats = (projByWeek[w] || {})[pid];
        if(projStats){
          projected = calcPoints(projStats, scoring);
          if(projected === null) projected = projStats.pts_std ?? null;
        }
        DB.allStarters.push({
          pid, week:w, year,
          points, projected,
          teamRosterId: entry.roster_id,
          teamName: team ? team.name : 'Unknown',
          managerKey
        });
      });
    });
  });
}

// Generic scoring calculator — iterates every key in the league's scoring_settings
// and multiplies by the matching stat value. Sleeper uses identical key names across
// sports, so this needs no NBA-specific translation; ported directly from football.
// Computes a matchup entry's team total, in priority order:
//   1. entry.custom_points — a manual commissioner score override. Sleeper supports this
//      for correcting a team's total independent of individual player stats (e.g. fixing
//      a known scoring bug without touching player-level numbers). When set, it's a
//      deliberate human decision and should always win.
//   2. SUM of players_points for that entry's starters — more reliable than the cached
//      entry.points field, since Sleeper occasionally applies retroactive stat corrections
//      (official NBA box score fixes) to individual players without necessarily refreshing
//      that cached total.
//   3. entry.points — last-resort fallback if players_points is entirely missing.
function getTeamComputedTotal(entry){
  if(entry.custom_points !== null && entry.custom_points !== undefined) return entry.custom_points;
  const ppts = entry.players_points;
  if(!ppts) return entry.points || 0;
  const starters = entry.starters || [];
  if(!starters.length) return entry.points || 0;
  let sum = 0, hasAny = false;
  starters.forEach(pid => {
    if(!pid || pid === '0') return;
    if(ppts[pid] !== undefined){ sum += ppts[pid]; hasAny = true; }
  });
  return hasAny ? sum : (entry.points || 0);
}

function calcPoints(stats, scoring){
  if(!stats || !scoring || Object.keys(scoring).length === 0) return null;
  let pts = 0, hasAny = false;
  for(const [key, weight] of Object.entries(scoring)){
    if(weight === 0) continue;
    const val = stats[key];
    if(val !== undefined && val !== null && val !== 0){
      pts += val * weight;
      hasAny = true;
    }
  }
  if(!hasAny) return null;
  return Math.round(pts * 100) / 100;
}

// "1" -> "1st", "2" -> "2nd", etc. Used for career POTG/POTW counts in the Weekly Recap.
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v-20)%10] || s[v] || s[0];
}

// Comma-separated number formatting (5243.4 -> "5,243.4"), used wherever a raw
// total is shown so large point totals read cleanly.
function fmtNum(n, decimals=1){
  if(n == null || isNaN(n)) return '—';
  return n.toLocaleString(undefined, {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}

// Proxies to a second Cloudflare Worker that talks to the Anthropic API. Not yet
// deployed — powers the Weekly Recap's AI blurb and, eventually, Smart Search.
// Mirrors the football archive's callClaude() pattern exactly.
async function callClaude(systemPrompt, userMessage){
  if(!CLAUDE_WORKER_URL || CLAUDE_WORKER_URL.includes('YOUR-WORKER')){
    throw new Error('This AI feature isn\u2019t configured yet — deploy a Claude proxy Worker, then paste its URL into CLAUDE_WORKER_URL.');
  }
  const resp = await fetch(CLAUDE_WORKER_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({system: systemPrompt, message: userMessage})
  });
  if(!resp.ok){
    const err = await resp.json().catch(()=>({}));
    throw new Error(err.error || `Worker error ${resp.status}`);
  }
  const data = await resp.json();
  return data.content || data.text || JSON.stringify(data);
}

// Full NBA player pool from Sleeper, used for name/position resolution.
async function loadPlayerPool(){
  const players = await apiFetch('/players/nba');
  Object.keys(players).forEach(pid => {
    const p = players[pid];
    if(!DB.playerMeta[pid]){
      DB.playerMeta[pid] = {
        name: p.full_name || `${p.first_name||''} ${p.last_name||''}`.trim(),
        teamAbbr: p.team,
        positionsBySeasonYear: {}
      };
    }
    // current-season eligibility as a fallback for the latest year; historical snapshots
    // (when wired in) should overwrite positionsBySeasonYear[year] with that season's actual data
    DB.playerMeta[pid].positionsBySeasonYear[CURRENT_SEASON] = (p.fantasy_positions || []).filter(x => TRUE_POSITIONS.includes(x));
  });
}

let PLAYER_NAME_INDEX = null; // built lazily by buildPlayerNameMap()
const PID_OVERRIDES = {
  // 'search string': 'sleeper_pid'  — fill in as edge cases surface
};

function normalizeNameForMatch(s){
  return (s||'').toLowerCase().replace(/[.'-]/g,'').replace(/\s+jr$|\s+sr$|\s+iii$|\s+ii$|\s+iv$/,'').trim();
}

function buildPlayerNameMap(){
  PLAYER_NAME_INDEX = {};
  Object.keys(DB.playerMeta).forEach(pid => {
    const key = normalizeNameForMatch(DB.playerMeta[pid].name);
    if(key) PLAYER_NAME_INDEX[key] = pid;
  });
}

function lookupPid(name){
  if(PID_OVERRIDES[name]) return PID_OVERRIDES[name];
  if(!PLAYER_NAME_INDEX) buildPlayerNameMap();
  const key = normalizeNameForMatch(name);
  return PLAYER_NAME_INDEX[key] || null;
}

function renderSidebarNav(){
  const el = document.getElementById('sidebar-nav');
  el.innerHTML = NAV_GROUPS.map(g => `
    <div class="nav-section">
      <div class="nav-label">${g.label}</div>
      ${g.pages.map(p => `
        <div class="nav-item" data-nav="${p.key}" onclick="switchTab('${p.key}')">
          <i class="ti ${p.icon}"></i>${p.label}${p.ready ? '' : '<span style="margin-left:auto;color:var(--text-faint);font-size:10px;">soon</span>'}

    <div class="nav-section" style="border-top:1px solid var(--border-soft);margin-top:6px;padding-top:14px;">
      <div class="nav-item" data-nav="${SEARCH_PAGE.key}" onclick="switchTab('${SEARCH_PAGE.key}')">
        <i class="ti ${SEARCH_PAGE.icon}"></i>${SEARCH_PAGE.label}

}

function renderBottomNav(){
  const el = document.getElementById('bn-main');
  el.innerHTML = NAV_GROUPS.map(g => `
    <div class="bn-item" data-navgroup="${g.key}" onclick="onBottomGroupTap('${g.key}')">
      <i class="ti ${g.icon}"></i><span>${g.label}</span>
    </div>`).join('') + `
    <div class="bn-item" data-nav="${SEARCH_PAGE.key}" onclick="switchTab('${SEARCH_PAGE.key}')">
      <i class="ti ${SEARCH_PAGE.icon}"></i><span>${SEARCH_PAGE.label}</span>
    </div>`;
}

function onBottomGroupTap(groupKey){
  activeBottomGroup = groupKey;
  const group = NAV_GROUPS.find(g => g.key === groupKey);
  if(group && group.pages.length) switchTab(group.pages[0].key);
}

function renderBottomSubrow(){
  const el = document.getElementById('bn-subrow');
  const group = NAV_GROUPS.find(g => g.key === activeBottomGroup);
  if(!group){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  el.innerHTML = group.pages.map(p => `
    <div class="yr-chip ${p.key===currentPageKey?'active':''}" data-nav="${p.key}" onclick="switchTab('${p.key}')">${p.label}</div>`).join('');
}

function renderYearChips(containerId, onSelect, selectedYear){
  const el = document.getElementById(containerId);
  if(!el) return;
  const years = Object.keys(LEAGUE_IDS).map(Number).sort((a,b)=>b-a);
  el.innerHTML = years.map(y => `
    <div class="yr-chip ${y===selectedYear?'active':''}" data-year="${y}">${seasonLabel(y)}</div>`).join('');
  el.querySelectorAll('.yr-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      el.querySelectorAll('.yr-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      onSelect(Number(chip.dataset.year));
    });
  });
}

function switchTab(name){
  const page = PAGES[name];
  if(!page) return;
  currentPageKey = name;

  document.querySelectorAll('.panel').forEach(panelEl => {
    panelEl.classList.toggle('active', panelEl.id === `panel-${name}`);
  });
  document.querySelectorAll('[data-nav]').forEach(navEl => {
    navEl.classList.toggle('active', navEl.dataset.nav === name);
  });
  document.querySelectorAll('[data-navgroup]').forEach(navEl => {
    navEl.classList.toggle('active', navEl.dataset.navgroup === page.group);
  });

  if(page.group){ activeBottomGroup = page.group; }
  renderBottomSubrow();

  if(RENDER_FNS[name]) RENDER_FNS[name]();
}

// Prefers the current season if it actually has matchup data loaded; otherwise
// falls back to the most recently completed season. Drives every "current" framing
// on the Dashboard now that the season-toggle chips are gone.
function getActiveSeasonYear(){
  const curSeason = DB.seasons[DB.currentSeason];
  if(curSeason && Object.keys(curSeason.matchupsByWeek||{}).length) return DB.currentSeason;
  return CURRENT_SEASON - 1;
}

// Walks backward from the most recent loaded season/week to find the signed-in
// manager's most recent matchup — this doubles as "current week" when a season is
// actively in progress, and gracefully becomes "most recent" otherwise (e.g. pre-draft).
function getMostRecentMatchupForManager(managerKey){
  if(!managerKey) return null;
  const years = Object.keys(DB.seasons).map(Number).sort((a,b)=>b-a);
  for(const year of years){
    const season = DB.seasons[year];
    const weeks = Object.keys(season.matchupsByWeek||{}).map(Number).sort((a,b)=>b-a);
    for(const week of weeks){
      const mus = season.matchupsByWeek[week];
      const myEntry = mus.find(m => season.rosterIdToManagerKey[m.roster_id] === managerKey);
      if(!myEntry) continue;
      const oppEntry = mus.find(m => m.matchup_id === myEntry.matchup_id && m.roster_id !== myEntry.roster_id);
      if(!oppEntry) continue;
      return {year, week, myPts: getTeamComputedTotal(myEntry), oppPts: getTeamComputedTotal(oppEntry), oppKey: season.rosterIdToManagerKey[oppEntry.roster_id]};
    }
  }
  return null;
}

// Biggest all-time career-scoring rank movement caused by the most recent loaded
// week's games — a "riser" gained ranking spots, a "faller" lost them. Compares
// each player's all-time rank with vs. without the latest week's points.
// Returns {pid: delta} for every player with any lineup points, where delta is how many
// spots their ALL-TIME career-scoring rank moved due to the most recently loaded week's
// games (positive = moved up). Shared by the Dashboard's Riser/Faller boxes and the
// Player Scoring tables' week-over-week rank-change column.
function computeAllTimeRankDeltas(){
  let latestYear = null, latestWeek = null;
  Object.entries(DB.seasons).forEach(([yearStr, season]) => {
    const year = Number(yearStr);
    Object.keys(season.matchupsByWeek||{}).forEach(wStr => {
      const week = Number(wStr);
      if(latestYear===null || year>latestYear || (year===latestYear && week>latestWeek)){
        latestYear = year; latestWeek = week;
      }
    });
  });
  if(latestYear===null) return {deltas:{}, latestYear:null, latestWeek:null};

  const beforeTotals = {}, afterTotals = {};
  DB.allStarters.forEach(s => {
    afterTotals[s.pid] = (afterTotals[s.pid]||0) + (s.points||0);
    if(!(s.year===latestYear && s.week===latestWeek)) beforeTotals[s.pid] = (beforeTotals[s.pid]||0) + (s.points||0);
  });
  const beforeRank = Object.entries(beforeTotals).sort((a,b)=>b[1]-a[1]).map(([pid])=>pid);
  const afterRank = Object.entries(afterTotals).sort((a,b)=>b[1]-a[1]).map(([pid])=>pid);
  const beforeIdx = {}; beforeRank.forEach((pid,i) => beforeIdx[pid]=i+1);
  const afterIdx = {}; afterRank.forEach((pid,i) => afterIdx[pid]=i+1);

  const deltas = {};
  afterRank.forEach(pid => { deltas[pid] = (beforeIdx[pid] || (beforeRank.length+1)) - afterIdx[pid]; });
  return {deltas, latestYear, latestWeek};
}

function computeRisersFallers(){
  const {deltas, latestYear, latestWeek} = computeAllTimeRankDeltas();
  const entries = Object.entries(deltas).map(([pid, delta]) => ({pid, delta}));
  if(!entries.length) return {};
  const riser = [...entries].sort((a,b) => b.delta - a.delta)[0];
  const faller = [...entries].sort((a,b) => a.delta - b.delta)[0];
  return {riser, faller, latestYear, latestWeek};
}

// Shared cell renderer for the "vs last week" rank-change column in Player Scoring tables.
function renderRankDeltaCell(delta){
  if(delta === undefined || delta === null) return '<span style="color:var(--text-faint);">—</span>';
  if(delta > 0) return `<span style="color:var(--good);white-space:nowrap;"><i class="ti ti-arrow-up"></i> ${delta}</span>`;
  if(delta < 0) return `<span style="color:var(--bad);white-space:nowrap;"><i class="ti ti-arrow-down"></i> ${Math.abs(delta)}</span>`;
  return '<span style="color:var(--text-faint);">—</span>';
}

function renderDashboardBoxes(){
  const activeYear = getActiveSeasonYear();
  const season = DB.seasons[activeYear];
  const boxHead = label => `<div style="color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">${label}</div>`;

  let myBox = `<div class="card">${boxHead('Your Season')}<div style="color:var(--text-faint);font-size:12.5px;">Sign in to see this</div></div>`;
  if(DB.myManagerKey && season){
    const myTeam = (season.teams||[]).find(t => t.managerKey===DB.myManagerKey);
    if(myTeam){
      const ranked = [...(season.teams||[])].sort((a,b) => b.wins-a.wins || b.pf-a.pf);
      const rank = ranked.findIndex(t => t.managerKey===DB.myManagerKey)+1;
      myBox = `<div class="card">${boxHead('Your Season')}
        <div style="font-size:17px;font-weight:700;font-family:var(--font-display);">${myTeam.wins}\u2013${myTeam.losses}</div>
        <div style="color:var(--text-dim);font-size:11.5px;">#${rank} \u00b7 ${fmtNum(myTeam.pf,0)} PF</div></div>`;
    }
  }

  let leaderBox = `<div class="card">${boxHead('League Leader')}<div style="color:var(--text-faint);font-size:12.5px;">No data yet</div></div>`;
  if(season && season.teams && season.teams.length){
    const leader = [...season.teams].sort((a,b) => b.wins-a.wins || b.pf-a.pf)[0];
    leaderBox = `<div class="card">${boxHead('League Leader')}
      <div style="font-size:14px;font-weight:700;">${(getManager(leader.managerKey)||{}).name||leader.managerKey}</div>
      <div style="color:var(--text-dim);font-size:11.5px;">${leader.wins}\u2013${leader.losses} \u00b7 ${fmtNum(leader.pf,0)} PF</div></div>`;
  }

  let potwBox = `<div class="card">${boxHead('Recent POTW')}<div style="color:var(--text-faint);font-size:12.5px;">No data yet</div></div>`;
  const potwLog = computePotgData('all').filter(e => e.type==='POTW').sort((a,b) => b.year-a.year || b.week-a.week);
  if(potwLog.length){
    const recent = potwLog[0];
    potwBox = `<div class="card">${boxHead('Recent POTW')}
      <div style="font-size:14px;font-weight:700;">${(DB.playerMeta[recent.pid]||{}).name||recent.pid}</div>
      <div style="color:var(--text-dim);font-size:11.5px;">${fmtNum(recent.pts)} pts \u00b7 ${seasonLabel(recent.year)} Wk ${recent.week}</div></div>`;
  }

  const myTitles = DB.myManagerKey ? Object.values(FINAL_STANDINGS).filter(f => f.champion===DB.myManagerKey).length : 0;
  const champBox = `<div class="card">${boxHead('Championships')}
    <div style="font-size:20px;font-weight:700;font-family:var(--font-display);color:var(--gold);">${myTitles}</div></div>`;

  const {riser, faller} = computeRisersFallers();
  const riserBox = riser ? `<div class="card" style="border-left:3px solid var(--good);">${boxHead('Riser')}
    <div style="font-size:14px;font-weight:700;">${(DB.playerMeta[riser.pid]||{}).name||riser.pid}</div>
    <div style="color:var(--good);font-size:11.5px;">\u2191 ${riser.delta} spot${riser.delta!==1?'s':''}</div></div>`
    : `<div class="card">${boxHead('Riser')}<div style="color:var(--text-faint);font-size:12.5px;">No data yet</div></div>`;
  const fallerBox = faller ? `<div class="card" style="border-left:3px solid var(--bad);">${boxHead('Faller')}
    <div style="font-size:14px;font-weight:700;">${(DB.playerMeta[faller.pid]||{}).name||faller.pid}</div>
    <div style="color:var(--bad);font-size:11.5px;">\u2193 ${Math.abs(faller.delta)} spot${Math.abs(faller.delta)!==1?'s':''}</div></div>`
    : `<div class="card">${boxHead('Faller')}<div style="color:var(--text-faint);font-size:12.5px;">No data yet</div></div>`;

  return `<div class="card-grid">${myBox}${leaderBox}${potwBox}${champBox}${riserBox}${fallerBox}</div>`;
}

/* ============================================================
   WEEKLY RECAP
   Season + week picker, matchup results for that week, POTG/POTW,
   and an AI-generated narrative blurb (via callClaude, not yet configured).
   Regular season only — matchupsByWeek was loaded with only regular-season
   weeks, so playoff weeks never appear in the picker.
   ============================================================ */
function renderRecapPanel(){
  const el = document.getElementById('recap-body');
  const years = Object.keys(DB.seasons).map(Number).sort((a,b)=>b-a);
  el.innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <select id="recap-yr-sel" style="padding:9px 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-panel);color:var(--text);font-size:13px;">
        <option value="">Season\u2026</option>
        ${years.map(y => `<option value="${y}">${seasonLabel(y)}</option>`).join('')}
      </select>
      <select id="recap-wk-sel" style="padding:9px 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-panel);color:var(--text);font-size:13px;">
        <option value="">Week\u2026</option>
      </select>
    </div>
    <div id="recap-card"><div class="empty-state"><i class="ti ti-notebook"></i>Select a season and week above.</div></div>
  `;
  document.getElementById('recap-yr-sel').addEventListener('change', onRecapYearChange);
  document.getElementById('recap-wk-sel').addEventListener('change', renderRecapFor);
}

function onRecapYearChange(){
  const yr = document.getElementById('recap-yr-sel').value;
  const wkSel = document.getElementById('recap-wk-sel');
  if(!yr){ wkSel.innerHTML = `<option value="">Week\u2026</option>`; return; }
  const season = DB.seasons[yr];
  if(!season) return;
  const weeks = Object.keys(season.matchupsByWeek).map(Number).sort((a,b)=>a-b);
  wkSel.innerHTML = `<option value="">Week\u2026</option>` + weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
  document.getElementById('recap-card').innerHTML = `<div class="empty-state"><i class="ti ti-notebook"></i>Select a week above.</div>`;
}

function renderRecapFor(){
  const yr = Number(document.getElementById('recap-yr-sel').value);
  const wk = Number(document.getElementById('recap-wk-sel').value);
  const card = document.getElementById('recap-card');
  if(!yr || !wk){ card.innerHTML = `<div class="empty-state"><i class="ti ti-notebook"></i>Select a season and week above.</div>`; return; }

  const season = DB.seasons[yr];
  const mus = (season && season.matchupsByWeek[wk]) || [];
  if(!mus.length){ card.innerHTML = `<div class="empty-state"><i class="ti ti-notebook"></i>No matchup data for this week.</div>`; return; }

  const byId = {};
  mus.forEach(m => { (byId[m.matchup_id] = byId[m.matchup_id] || []).push(m); });
  const pairs = Object.values(byId).filter(p => p.length >= 2);

  const results = pairs.map(([a,b]) => {
    const ka = season.rosterIdToManagerKey[a.roster_id], kb = season.rosterIdToManagerKey[b.roster_id];
    const pa = getTeamComputedTotal(a), pb = getTeamComputedTotal(b);
    const aWon = pa >= pb;
    const winnerKey = aWon ? ka : kb, loserKey = aWon ? kb : ka;
    const wPts = aWon ? pa : pb, lPts = aWon ? pb : pa;
    const h2h = computeAllTimeH2H(winnerKey, loserKey);
    return {winnerKey, loserKey, wPts, lPts, wWins:h2h.w1, lWins:h2h.w2, total:wPts+lPts};
  }).sort((a,b) => b.total - a.total);

  // POTG per matchup + POTW for the week, using our confirmed tie rules via computePotgData
  const weekLog = computePotgData(yr).filter(e => e.week === wk);
  const potgList = weekLog; // every entry is a POTG; POTW-typed ones are also POTG (possibly shared)
  const potwEntries = weekLog.filter(e => e.type === 'POTW');
  const allLog = computePotgData('all');
  const getPotgCount = pid => allLog.filter(e => e.pid === pid).length;
  const getPotwCount = pid => allLog.filter(e => e.pid === pid && e.type === 'POTW').length;

  const standingRows = [...(season.teams||[])].sort((a,b) => b.wins-a.wins || b.pf-a.pf);

  card.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
        <div>
          <h3 style="margin-bottom:2px;">Docile Archive Weekly</h3>
          <div style="color:var(--text-dim);font-size:12.5px;">${seasonLabel(yr)} \u00b7 Week ${wk}</div>
        </div>
        <button onclick="generateRecapBlurb(${yr},${wk})" style="padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-hover);color:var(--text-dim);font-size:12px;cursor:pointer;">
          <i class="ti ti-sparkles"></i> Generate blurb
        </button>
      </div>
      <div id="recap-blurb" style="font-style:italic;color:var(--text-faint);font-size:13px;margin-bottom:18px;"></div>

      <div style="margin-bottom:18px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;">Results</div>
        ${results.map(r => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;">
            <span><strong>${getManagerDisplay(r.winnerKey, yr)}</strong> def. ${getManagerDisplay(r.loserKey, yr)}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span style="font-family:var(--font-mono);">${r.wPts.toFixed(2)}\u2013${r.lPts.toFixed(2)}</span>
              <span style="color:var(--text-faint);font-size:11.5px;">(${r.wWins}\u2013${r.lWins} all-time)</span>
            </span>
          </div>`).join('')}
      </div>

      <div style="margin-bottom:18px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;">Player of the Week</div>
        ${potwEntries.length ? potwEntries.map(p => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;">
            <span class="trophy-chip"><i class="ti ti-star"></i>POTW</span>
            <div style="flex:1;">
              <div style="font-weight:600;"><span class="player-link" onclick="openPlayerModal('${p.pid}');return false;">${(DB.playerMeta[p.pid]||{}).name||p.pid}</span></div>
              <div style="color:var(--text-faint);font-size:11.5px;">${getManagerDisplay(p.managerKey, yr)} \u00b7 ${getPotwCount(p.pid)}${ordinal(getPotwCount(p.pid))} career POTW \u00b7 ${getPotgCount(p.pid)}${ordinal(getPotgCount(p.pid))} career POTG</div>
            </div>
            <span style="font-family:var(--font-mono);font-weight:700;">${p.pts.toFixed(1)}</span>
          </div>`).join('') : `<div style="color:var(--text-faint);font-size:12.5px;">No data</div>`}
      </div>

      <div style="margin-bottom:18px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;">Players of the Game</div>
        ${potgList.map(p => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;">
            <span class="pos-badge pos-multi" style="min-width:34px;">${p.type==='POTW'?'\u2605':'POTG'}</span>
            <div style="flex:1;">
              <div>${(DB.playerMeta[p.pid]||{}).name||p.pid}</div>
              <div style="color:var(--text-faint);font-size:11px;">${getManagerDisplay(p.managerKey, yr)} \u00b7 ${getPotgCount(p.pid)}${ordinal(getPotgCount(p.pid))} career POTG</div>
            </div>
            <span style="font-family:var(--font-mono);">${p.pts.toFixed(1)}</span>
          </div>`).join('')}
      </div>

      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;">Season Standings</div>
        ${standingRows.map((t,i) => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;">
            <span style="color:var(--text-faint);width:20px;">${i+1}</span>
            <span style="flex:1;${t.managerKey===DB.myManagerKey?'font-weight:700;':''}">${getManagerDisplay(t.managerKey, yr)}</span>
            <span style="font-family:var(--font-mono);color:var(--text-dim);">${t.wins}\u2013${t.losses}</span>
            <span style="font-family:var(--font-mono);color:var(--text-faint);font-size:11px;">${t.pf.toFixed(1)} pts</span>
          </div>`).join('')}
      </div>
    </div>
  `;
}

async function generateRecapBlurb(yr, wk){
  const el = document.getElementById('recap-blurb');
  el.textContent = 'Generating\u2026';
  try{
    const summary = `${LEAGUE_NAME}, ${seasonLabel(yr)} Week ${wk}.`;
    const text = await callClaude(
      'You are a witty fantasy basketball recap writer. Write 2-3 sentences.',
      summary
    );
    el.textContent = text;
  }catch(e){
    el.textContent = e.message;
  }
}

function renderMyScoringTableBody(){
  const body = document.getElementById('myscoring-table-body');
  if(!body) return;
  const search = normalizeNameForMatch(document.getElementById('myscoring-search')?.value || '');
  const posFilter = document.getElementById('myscoring-pos-filter')?.value || 'all';

  const starters = DB.allStarters.filter(s => s.managerKey === DB.myManagerKey);
  const agg = {};
  starters.forEach(s => {
    if(!agg[s.pid]) agg[s.pid] = {pid:s.pid, starts:0, total:0, best:0};
    agg[s.pid].starts++;
    agg[s.pid].total += (s.points || 0);
    if((s.points || 0) > agg[s.pid].best) agg[s.pid].best = s.points || 0;
  });

  let rows = Object.values(agg).map(p => {
    const meta = DB.playerMeta[p.pid] || {};
    const positions = getPlayerPositions(p.pid, CURRENT_SEASON);
    return {...p, name: meta.name || `Player ${p.pid}`, positions, avg: p.starts ? p.total/p.starts : 0};
  });

  if(search) rows = rows.filter(r => normalizeNameForMatch(r.name).includes(search));
  if(posFilter !== 'all') rows = rows.filter(r => r.positions.includes(posFilter));

  const dir = myScoringSort.dir;
  const sf = {
    total:(a,b)=>(a.total-b.total)*dir, starts:(a,b)=>(a.starts-b.starts)*dir,
    avg:(a,b)=>(a.avg-b.avg)*dir, best:(a,b)=>(a.best-b.best)*dir
  };
  rows.sort(sf[myScoringSort.col] || sf.total);

  const {deltas} = computeAllTimeRankDeltas();

  if(!rows.length){ body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-faint);padding:24px;">No starters found.</td></tr>`; return; }

  body.innerHTML = rows.map(r => `<tr>
    <td><span class="player-link" onclick="openPlayerModal('${r.pid}');return false;">${r.name}</span></td>
    <td>${renderPositionBadge(r.positions)}</td>
    <td>${fmtNum(r.total)}</td>
    <td>${r.starts}</td>
    <td>${fmtNum(r.avg)}</td>
    <td>${fmtNum(r.best)}</td>
    <td>${renderRankDeltaCell(deltas[r.pid])}</td>
  </tr>`).join('');
}

function renderMyH2HPanel(){

      if(managerKey !== DB.myManagerKey) return;
      const name = (p.metadata && p.metadata.first_name) ? `${p.metadata.first_name} ${p.metadata.last_name}` : (p.player_id || 'Unknown');
      const myStarts = p.player_id ? DB.allStarters.filter(s => s.pid === p.player_id && s.managerKey === DB.myManagerKey) : [];
      const pts = myStarts.reduce((a,b) => a + (b.points||0), 0);

function renderMyTradesList(){
  const el = document.getElementById('mytrades-list');
  const sortF = document.getElementById('mytrades-sort-filter')?.value || 'recent';

  const myRosterIds = new Set();
  Object.values(DB.seasons).forEach(s => {
    (s.teams||[]).forEach(t => { if(t.managerKey === DB.myManagerKey) myRosterIds.add(t.rosterId); });
  });

  const myTrades = DB.transactions.filter(t => (t.roster_ids||[]).some(r => myRosterIds.has(r)));
  if(!myTrades.length){ el.innerHTML = `<div class="empty-state"><i class="ti ti-arrows-exchange"></i>No trades found on your roster.</div>`; return; }

  const tradeData = myTrades.map(t => {
    const season = DB.seasons[t.year];
    const [r1, r2] = t.roster_ids || [0,0];
    const mk1 = season ? season.rosterIdToManagerKey[r1] : null;
    const mk2 = season ? season.rosterIdToManagerKey[r2] : null;
    const adds = t.adds || {};
    const buildSide = (rid) => {
      const items = Object.entries(adds).filter(([,r]) => r === rid).map(([pid]) => {
        const meta = DB.playerMeta[pid] || {};
        const pts = DB.allStarters.filter(s => s.pid === pid && s.year >= t.year && s.teamRosterId === rid).reduce((a,b) => a+(b.points||0), 0);
        return {name: meta.name || pid, pts};
      });
      (t.draft_picks || []).filter(p => p.owner_id === rid).forEach(p => {
        items.push({name:`${p.season || t.year} Round ${p.round} pick`, pts:0});
      });
      return items;
    };
    const side1 = buildSide(r1), side2 = buildSide(r2);
    const total1 = side1.reduce((a,b)=>a+b.pts,0), total2 = side2.reduce((a,b)=>a+b.pts,0);
    return {t, mk1, mk2, side1, side2, total1, total2, combined: total1+total2, winnerTotal: Math.max(total1,total2), loserTotal: Math.min(total1,total2)};
  });

  const sortFns = {
    recent:(a,b) => b.t.year-a.t.year || b.t.week-a.t.week,
    combined:(a,b) => b.combined-a.combined,
    winner:(a,b) => b.winnerTotal-a.winnerTotal,
    loser:(a,b) => b.loserTotal-a.loserTotal
  };
  tradeData.sort(sortFns[sortF] || sortFns.recent);

  el.innerHTML = tradeData.map(({t, mk1, mk2, side1, side2, total1, total2}) => {
    const t1Wins = total1 >= total2;
    return `<div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;color:var(--text-faint);font-size:11.5px;margin-bottom:10px;">
        <span>${seasonLabel(t.year)} \u00b7 Week ${t.week}</span>
        <span>${(getManager(mk1)||{}).name||mk1} \u2194 ${(getManager(mk2)||{}).name||mk2}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>
          <div style="font-weight:600;font-size:12.5px;margin-bottom:6px;">${(getManager(mk1)||{}).name||mk1} received${mk1===DB.myManagerKey?' (you)':''}</div>
          ${side1.map(p => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${p.name}</span><span style="color:var(--text-faint);">${p.pts>0?fmtNum(p.pts)+' pts':'—'}</span></div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">Draft picks only</div>'}
          <div style="font-weight:700;font-size:12.5px;margin-top:6px;${t1Wins?'color:var(--good);':''}">${fmtNum(total1)} pts total${t1Wins?' \u2713':''}</div>
        </div>
        <div>
          <div style="font-weight:600;font-size:12.5px;margin-bottom:6px;">${(getManager(mk2)||{}).name||mk2} received${mk2===DB.myManagerKey?' (you)':''}</div>
          ${side2.map(p => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${p.name}</span><span style="color:var(--text-faint);">${p.pts>0?fmtNum(p.pts)+' pts':'—'}</span></div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">Draft picks only</div>'}
          <div style="font-weight:700;font-size:12.5px;margin-top:6px;${!t1Wins?'color:var(--good);':''}">${fmtNum(total2)} pts total${!t1Wins?' \u2713':''}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   ALL-TIME LINEUP
   Best-ever starting lineup for the signed-in manager, using the same
   scarcity-fill slot algorithm as All-Docile team construction, scoped
   to only that manager's own starts.
   ============================================================ */
let myLineupMode = 'total';
const MY_LINEUP_MODE_LABELS = {games:'Most starts', total:'All-time points', season:'Best season', best:'Best single game'};

function setMyLineupMode(mode){
  myLineupMode = mode;
  renderMyLineupPanel();
}

function renderMyLineupPanel(){
  const el = document.getElementById('mylineup-body');
  if(!DB.myManagerKey){
    el.innerHTML = `<div class="empty-state"><i class="ti ti-user-question"></i>Sign in with a recognized Fellowship username to see your all-time lineup.</div>`;
    return;
  }
  const myStarters = DB.allStarters.filter(s => s.managerKey === DB.myManagerKey);
  if(!myStarters.length){ el.innerHTML = `<div class="empty-state"><i class="ti ti-crown"></i>No starts found for your roster.</div>`; return; }

  const byPid = {};
  myStarters.forEach(s => {
    if(!byPid[s.pid]) byPid[s.pid] = {pid:s.pid, starts:0, total:0, best:0, seasonTotals:{}};
    byPid[s.pid].starts++;
    byPid[s.pid].total += (s.points||0);
    if((s.points||0) > byPid[s.pid].best) byPid[s.pid].best = s.points||0;
    byPid[s.pid].seasonTotals[s.year] = (byPid[s.pid].seasonTotals[s.year]||0) + (s.points||0);
  });
  Object.values(byPid).forEach(p => {
    let bestYear = null, bestTotal = 0;
    Object.entries(p.seasonTotals).forEach(([yr, total]) => { if(total > bestTotal){ bestTotal = total; bestYear = Number(yr); } });
    p.bestSeason = bestTotal;
    p.bestSeasonYear = bestYear;
  });

  const metric = {games:'starts', total:'total', best:'best', season:'bestSeason'}[myLineupMode];
  let pool = Object.keys(byPid).sort((a,b) => byPid[b][metric] - byPid[a][metric]);

  // Backend slot selection stays in scarcity-fill order (C,PF,SF,PG,SG,F,G,UTIL,UTIL,UTIL)
  // — this algorithm is unchanged and working correctly. Only the DISPLAY is reordered
  // to the conventional lineup reading order below.
  const roster = [];
  FLEX_FILL_ORDER.forEach(slot => {
    const idx = pool.findIndex(pid => isEligibleForSlot(pid, slot, CURRENT_SEASON));
    if(idx === -1){ roster.push({slot, pid:null}); return; }
    const pid = pool[idx];
    roster.push({slot, pid, ...byPid[pid], resolvedPosition: resolvePositionForSlot(pid, slot, CURRENT_SEASON)});
    pool.splice(idx,1);
  });
  const displayRoster = [...roster].sort((a,b) => LINEUP_SLOTS.indexOf(a.slot) - LINEUP_SLOTS.indexOf(b.slot));

  const valueLabel = (r) => {
    if(!r.pid) return '';
    if(myLineupMode === 'games') return `${r.starts} starts`;
    if(myLineupMode === 'best') return `${fmtNum(r.best)} pts (best)`;
    if(myLineupMode === 'season') return r.bestSeasonYear ? `${fmtNum(r.bestSeason)} pts (${seasonLabel(r.bestSeasonYear)})` : '—';
    return `${fmtNum(r.total)} pts`;
  };

  el.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">

/* ============================================================
   MY NBA BREAKDOWN
   How often the signed-in manager has started players from each NBA team.
   Note: Sleeper only stores each player's CURRENT team, so a traded player's
   history reflects their present team, not their team at the time they started.
   ============================================================ */
function renderMyNbaPanel(){
  const el = document.getElementById('mynba-body');
  if(!DB.myManagerKey){
    el.innerHTML = `<div class="empty-state"><i class="ti ti-user-question"></i>Sign in with a recognized Fellowship username to see your NBA team breakdown.</div>`;
    return;
  }
  const myStarters = DB.allStarters.filter(s => s.managerKey === DB.myManagerKey);
  const byTeam = {};
  myStarters.forEach(s => {
    const meta = DB.playerMeta[s.pid];
    const nbaTeam = meta ? meta.teamAbbr : null;
    if(!nbaTeam) return;
    if(!byTeam[nbaTeam]) byTeam[nbaTeam] = {team:nbaTeam, appearances:0, players:new Set()};
    byTeam[nbaTeam].appearances++;
    byTeam[nbaTeam].players.add(s.pid);
  });

  const rows = Object.values(byTeam).map(r => ({...r, unique:r.players.size})).sort((a,b) => b.appearances - a.appearances);
  if(!rows.length){ el.innerHTML = `<div class="empty-state"><i class="ti ti-building-stadium"></i>No data found.</div>`; return; }

  const maxApp = Math.max(...rows.map(r => r.appearances));
  el.innerHTML = `
    <div class="card" style="border-color:var(--bad);margin-bottom:16px;">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <i class="ti ti-alert-triangle" style="color:var(--bad);font-size:18px;flex-shrink:0;margin-top:1px;"></i>
        <div>
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;">Known limitation \u2014 likely to change</div>
          <div style="color:var(--text-dim);font-size:12.5px;line-height:1.5;">Sleeper only stores each player's <em>current</em> NBA team, not the team they were on at the time they were in your lineup. A player traded mid-career shows up entirely under their current team here, which can meaningfully misrepresent this breakdown for anyone who's changed teams. This page needs a rethink before it's trustworthy \u2014 treat it as a rough approximation for now.</div>
        </div>
      </div>
    </div>
    <table class="data-table">
      <thead><tr><th>NBA Team</th><th>Appearances</th><th>Unique Players</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr>
