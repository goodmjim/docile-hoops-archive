/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0b0d10;
  --bg-elevated:#12151a;
  --bg-panel:#161a20;
  --bg-hover:#1d222a;
  --border:#232830;
  --border-soft:#1a1e24;
  --text:#e7e9ec;
  --text-dim:#9aa2ad;
  --text-faint:#5f6772;

  --accent:#e8823a;       /* fellowship orange — signature color */
  --accent-dim:#c96b28;
  --accent-soft:rgba(232,130,58,0.14);

  --gold:#d8b04a;         /* champion trophy gold */
  --good:#3fb673;
  --bad:#d9534f;

  /* position colors */
  --pos-pg:#e0503f;
  --pos-sg:#e08a2f;
  --pos-sf:#3fae5c;
  --pos-pf:#3f83c9;
  --pos-c:#9a5fc9;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;

  --font-display:'Rajdhani','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Consolas',monospace;

  --sidebar-w:230px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0 0 .5em;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   SIGN-IN GATE
   ============================================================ */
#setup{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at top, rgba(232,130,58,0.08), transparent 60%), var(--bg);
}
.setup-box{
  width:100%;max-width:400px;
  background:var(--bg-elevated);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:32px 28px;
}
.setup-logo{text-align:center;margin-bottom:28px;}
.setup-logo i{font-size:36px;color:var(--accent);}
.setup-logo h1{font-size:22px;line-height:1.25;margin:10px 0 6px;}
.setup-logo p{color:var(--text-faint);font-size:12.5px;margin:0;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:6px;}
.fg input{
  width:100%;padding:10px 14px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--bg-panel);
  color:var(--text);
  font-size:14px;
}
.fg input:focus{outline:none;border-color:var(--accent-dim);}
.btn-load{
  width:100%;padding:11px;
  background:var(--accent);
  color:#1a0f05;
  border:none;border-radius:var(--radius-md);
  font-weight:700;font-size:14px;
  margin-bottom:8px;
}
.btn-load:hover{background:var(--accent-dim);}
.btn-guest{
  width:100%;padding:9px;
  background:transparent;
  color:var(--text-faint);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  font-size:12.5px;
}
.btn-guest:hover{color:var(--text-dim);border-color:var(--text-faint);}
#setup-status{
  font-size:12.5px;
  color:var(--text-dim);
  text-align:center;
  margin-top:14px;
  min-height:16px;
}
#setup-status.error{color:var(--bad);}
.prog-track{
  height:4px;border-radius:2px;
  background:var(--bg-panel);
  overflow:hidden;
  margin-top:6px;
}
.prog-fill{height:100%;width:0%;background:var(--accent);transition:width .25s ease;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{display:flex;min-height:100vh;}

/* --- Desktop sidebar --- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
#sidebar .brand{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border-soft);
}
#sidebar .brand .mark{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
}
#sidebar .brand .mark i{color:var(--accent);font-size:20px;}
#sidebar .brand .sub{font-size:11px;color:var(--text-faint);margin-top:3px;letter-spacing:.04em;text-transform:uppercase;}

.nav-section{padding:14px 10px 4px;}
.nav-section .nav-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--text-faint);
  padding:0 10px 6px;
  font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.5px;
  cursor:pointer;
  transition:background .12s,color .12s;
  white-space:nowrap;
}
.nav-item i{font-size:17px;width:18px;text-align:center;flex-shrink:0;}
.nav-item:hover{background:var(--bg-hover);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}

/* --- Main content --- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:none;
  padding:14px 20px;
  border-bottom:1px solid var(--border-soft);
  align-items:center;
  justify-content:space-between;
}
#content{flex:1;padding:24px 28px 100px;max-width:1400px;width:100%;margin:0 auto;}

.panel{display:none;}
.panel.active{display:block;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel-header{margin-bottom:20px;}
.panel-header h1{font-size:24px;}
.panel-header .desc{color:var(--text-dim);font-size:13px;}

/* --- Bottom nav (mobile) --- */
#bottomnav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-elevated);
  border-top:1px solid var(--border-soft);
  z-index:50;
}
#bottomnav .bn-main{
  display:flex;
}
#bottomnav .bn-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;
  color:var(--text-faint);
  font-size:10px;
}
#bottomnav .bn-item i{font-size:20px;}
#bottomnav .bn-item.active{color:var(--accent);}
#bottomnav .bn-subrow{
  display:flex;
  gap:8px;
  padding:8px 12px;
  overflow-x:auto;
  border-top:1px solid var(--border-soft);
}
.yr-chip{
  flex-shrink:0;
  padding:6px 12px;
  border-radius:999px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .12s;
}
.yr-chip.active{background:var(--accent);border-color:var(--accent);color:#1a0f05;}
.yr-chip:hover:not(.active){border-color:var(--accent-dim);color:var(--text);}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.card{
  background:var(--bg-panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:16px;
}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{
  text-align:left;
  padding:9px 10px;
  color:var(--text-faint);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
table.data-table th:hover{color:var(--text);}
table.data-table th .sort-arrow{opacity:.4;margin-left:3px;font-size:10px;}
table.data-table th.sorted .sort-arrow{opacity:1;color:var(--accent);}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
table.data-table tbody tr:hover{background:var(--bg-hover);}

/* position badges */
.pos-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:20px;padding:0 6px;
  border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;
  color:#0b0d10;
}
.pos-badge.pos-pg{background:var(--pos-pg);}
.pos-badge.pos-sg{background:var(--pos-sg);}
.pos-badge.pos-sf{background:var(--pos-sf);}
.pos-badge.pos-pf{background:var(--pos-pf);}
.pos-badge.pos-c{background:var(--pos-c);}
.pos-badge.pos-split{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.pos-badge.pos-multi{background:var(--bg-hover);color:var(--text-dim);border:1px solid var(--border);}

.trophy-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(216,176,74,0.12);
  border:1px solid rgba(216,176,74,0.35);
  color:var(--gold);
  padding:3px 9px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:600;
}
.trophy-chip i{font-size:13px;}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--text-faint);
}
.empty-state i{font-size:34px;display:block;margin-bottom:10px;opacity:.5;}

.loading-state{
  text-align:center;padding:40px;color:var(--text-faint);font-size:13px;
}

/* Modal */
#modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow-y:auto;
}
#modal-overlay.active{display:flex;}
#modal-box{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  max-width:640px;width:100%;
  padding:22px;
  position:relative;
}
#modal-close{
  position:absolute;top:14px;right:14px;
  background:var(--bg-hover);border:1px solid var(--border);
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);
}
#modal-close:hover{color:var(--text);}

/* Responsive */
@media (max-width:880px){
  #sidebar{display:none;}
  #topbar{display:flex;}
  #content{padding:16px 16px 140px;}
  #bottomnav{display:block;}
}
</style>

/* ============================================================

const FINAL_STANDINGS = {

/* ============================================================
   POTG / POTW
   Computed ON DEMAND from season.matchupsByWeek, mirroring the football archive's
   computePotgData() pattern rather than caching into DB — always in sync, no
   invalidation to worry about. Reads DB.allStarters as a fallback points source
   exactly like football does, for the rare case players_points is missing.

   Basketball-specific rules confirmed in-thread (these DIFFER from football's
   simpler "just take the single highest score" logic):
   - 6 POTG/week (1 per matchup), regardless of win/loss.
   - Tie within a matchup -> winning team's player gets it.
   - Tie within a matchup AND both tied players on the winning team -> first in Sleeper's data order.
   - POTW = highest score among the week's POTGs; ties at that top score are SHARED (no winner-team preference at this level).
   - Regular season only — matchupsByWeek only ever contains regular-season weeks (see loadSeasonScoring).
   ============================================================ */
function computePotgData(yearFilter='all'){
  const potgLog = []; // flat log: {pid, week, year, pts, type:'POTG'|'POTW', managerKey, rosterId}
  const years = yearFilter === 'all'
    ? Object.keys(DB.seasons).map(Number)
    : [Number(yearFilter)];

  years.forEach(year => {
    const season = DB.seasons[year];
    if(!season) return;

    Object.entries(season.matchupsByWeek).forEach(([wStr, mus]) => {
      const week = Number(wStr);
      const byMatchup = {};
      mus.forEach(m => { (byMatchup[m.matchup_id] = byMatchup[m.matchup_id] || []).push(m); });

      const weekPotgs = [];
      Object.values(byMatchup).forEach(pair => {
        if(pair.length < 2) return; // needs both sides to determine a winner

        const totals = {};
        pair.forEach(m => { totals[m.roster_id] = m.points; });
        const rosterIds = Object.keys(totals);
        const winningRosterId = totals[rosterIds[0]] >= totals[rosterIds[1]] ? rosterIds[0] : rosterIds[1];

        const candidates = [];
        pair.forEach(m => {
          const managerKey = season.rosterIdToManagerKey[m.roster_id];
          const ppts = m.players_points || {};
          (m.starters || []).forEach(pid => {
            if(!pid || pid === '0') return;
            const pts = ppts[pid] ?? DB.allStarters.find(e => e.pid===pid && e.week===week && e.year===year)?.points ?? null;
            if(pts === null) return;
            candidates.push({pid, pts, rosterId:m.roster_id, managerKey});
          });
        });
        if(!candidates.length) return;

        const maxScore = Math.max(...candidates.map(c => c.pts));
        let tied = candidates.filter(c => c.pts === maxScore);
        if(tied.length > 1){
          const onWinningTeam = tied.filter(c => String(c.rosterId) === String(winningRosterId));
          tied = onWinningTeam.length ? [onWinningTeam[0]] : [tied[0]]; // first-in-data-order fallback
        }
        weekPotgs.push({...tied[0], week, year, type:'POTG'});
      });

      potgLog.push(...weekPotgs);

      // POTW: highest score among this week's POTGs — SHARED on exact ties (unlike POTG, no winner-team tiebreak here)
      if(weekPotgs.length){
        const topScore = Math.max(...weekPotgs.map(p => p.pts));
        weekPotgs.filter(p => p.pts === topScore).forEach(p => { p.type = 'POTW'; });
      }
    });
  });

  return potgLog;
}

/* ============================================================
   ALL-DOCILE / ALL-ROOKIE TEAM CONSTRUCTION
   Deterministic scarcity-fill (not a true optimal assignment solve) — chosen for
   transparency: rarest-eligibility slot fills first so a highest scorer is never
   blocked out by a flex slot absorbing them earlier. See in-thread discussion.
   Season totals = sum of STARTER points only, regular season only.
   ============================================================ */
const FLEX_FILL_ORDER = ['C','PF','SF','PG','SG','F','G','UTIL','UTIL','UTIL'];
const ROOKIE_FILL_ORDER = ['C','PF','SF','PG','SG'];

// Aggregates lineup points per player for a season — mirrors the football archive's
// renderPlayers() aggregation, filtering the flat DB.allStarters array by year rather
// than reading from a nested per-week cache.
function computeSeasonTotals(year){
  const totals = {}; // pid -> points
  DB.allStarters.filter(s => s.year === year).forEach(s => {
    totals[s.pid] = (totals[s.pid] || 0) + (s.points || 0);
  });
  return totals;
}

function getPlayerPositions(pid, year){
  const meta = DB.playerMeta[pid];
  if(!meta) return [];
  return meta.positionsBySeasonYear[year] || meta.positionsBySeasonYear[CURRENT_SEASON] || [];
}

function isEligibleForSlot(pid, slot, year){
  const positions = getPlayerPositions(pid, year);
  return positions.some(p => SLOT_ELIGIBILITY[slot].includes(p));
}

// resolves which single true-position color/label to credit a player with when placed in a flex slot,
// preferring the position that actually satisfies that slot
function resolvePositionForSlot(pid, slot, year){
  const positions = getPlayerPositions(pid, year);
  const match = positions.find(p => SLOT_ELIGIBILITY[slot].includes(p));
  return match || positions[0] || slot;
}

function buildAllDocileTeams(year){
  const totals = computeSeasonTotals(year);
  let pool = Object.keys(totals)
    .filter(pid => totals[pid] > 0)
    .sort((a,b) => totals[b]-totals[a]);

  const teams = {};
  [1,2,3].forEach(teamNum => {
    const roster = [];
    FLEX_FILL_ORDER.forEach(slot => {
      const idx = pool.findIndex(pid => isEligibleForSlot(pid, slot, year));
      if(idx === -1){ roster.push({slot, pid:null, points:0}); return; }
      const pid = pool[idx];
      roster.push({slot, pid, points:totals[pid], resolvedPosition:resolvePositionForSlot(pid, slot, year)});
      pool.splice(idx,1);
    });
    teams[teamNum] = roster;
  });
  DB.awards.allDocile[year] = teams;
  return teams;
}

// Rookie status: a player counts as a rookie for `year` if they were selected in that
// year's rookie draft (ROOKIE_DRAFT_IDS[year]). This is a proxy for actual NBA rookie
// status — accurate for the vast majority of cases, but a late draft-and-stash pick who
// debuts a year after being drafted would be misattributed. Flag if that needs refining.
function getRookiePidsForYear(year){
  const picks = DB.draftPicks[year] || [];
  return new Set(picks.map(p => p.player_id));
}

function buildAllRookieTeam(year){
  const totals = computeSeasonTotals(year);
  const rookiePids = getRookiePidsForYear(year);
  let pool = Object.keys(totals)
    .filter(pid => totals[pid] > 0 && rookiePids.has(pid))
    .sort((a,b) => totals[b]-totals[a]);

  const teams = {};
  [1,2,3].forEach(teamNum => {
    const roster = [];
    ROOKIE_FILL_ORDER.forEach(slot => {
      const idx = pool.findIndex(pid => isEligibleForSlot(pid, slot, year));
      if(idx === -1){ roster.push({slot, pid:null, points:0}); return; }
      const pid = pool[idx];
      roster.push({slot, pid, points:totals[pid], resolvedPosition:slot});
      pool.splice(idx,1);
    });
    teams[teamNum] = roster;
  });
  DB.awards.allRookie[year] = teams;
  return teams;
}

function buildHonorsForYear(year){
  buildAllDocileTeams(year);
  buildAllRookieTeam(year);
}

async function apiFetch(path){
  const url = `${CF_WORKER_URL}${path.startsWith('/')?path:'/'+path}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`apiFetch failed [${res.status}] ${path}`);
  return res.json();
}

  if(!SNAPSHOT_BASE) return null;

    return res.json();
  }catch(e){ return null; }
}

function resolveUsername(rawUsername){
  return USERNAME_ALIASES[rawUsername] || rawUsername;

function getManager(managerKey){
  return MANAGERS[managerKey] || null;
}

function getManagersForYear(year){
  return Object.keys(MANAGERS).filter(k => MANAGERS[k].years.includes(year));
}

function getTeamName(managerKey, year){
  const eras = TEAM_NAMES[managerKey];
  if(!eras) return managerKey;
  const era = eras.find(e => e.years.includes(year));
  if(era) return era.name;
  // 2026 (and any future undefined year) inherits the most recent known era
  const latest = eras.reduce((a,b) => Math.max(...a.years) > Math.max(...b.years) ? a : b);
  return latest.name;
}

function getManagerDisplay(managerKey, year){
  const m = getManager(managerKey);
  return m ? `${getTeamName(managerKey, year)} (${m.name})` : managerKey;
}

// Compact badge for tables/cards: single color if one position, hard-stop split if two,
// neutral "multi" badge with text for 3+.
function renderPositionBadge(positions){
  if(!positions || !positions.length) return `<span class="pos-badge pos-multi">–</span>`;
  if(positions.length === 1){
    const p = positions[0];
    return `<span class="pos-badge pos-${p.toLowerCase()}">${p}</span>`;
  }
  if(positions.length === 2){
    const [a,b] = positions;
    const ca = `var(${POSITION_COLORS[a]})`, cb = `var(${POSITION_COLORS[b]})`;
    return `<span class="pos-badge pos-split" style="background:conic-gradient(${ca} 0deg 180deg, ${cb} 180deg 360deg);">${a}/${b}</span>`;
  }
  return `<span class="pos-badge pos-multi">${positions.join('/')}</span>`;
}

// Resolved-color badge for a player placed in a specific lineup slot (shows how they were USED, not eligibility)
function renderSlotBadge(resolvedPosition, slotLabel){
  const p = resolvedPosition;
  return `<span class="pos-badge pos-${p.toLowerCase()}" title="Started at ${slotLabel}">${slotLabel}</span>`;
}

// Loads one season's league settings, rosters, and users; resolves aliased usernames
// to canonical MANAGERS keys, and builds a `teams` array (mirrors the football
// archive's shape: rosterId/managerKey/name/wins/losses/pf/pa) alongside a fast
// rosterId -> managerKey lookup map for convenience.
async function loadSeason(year){
  const leagueId = LEAGUE_IDS[year];
  if(!leagueId) return null;

  const [league, rosters, users] = await Promise.all([
    apiFetch(`/league/${leagueId}`),
    apiFetch(`/league/${leagueId}/rosters`),
    apiFetch(`/league/${leagueId}/users`)
  ]);

  const userIdToManagerKey = {};
  users.forEach(u => { userIdToManagerKey[u.user_id] = resolveUsername(u.username || u.display_name); });

  const rosterIdToManagerKey = {};
  rosters.forEach(r => { rosterIdToManagerKey[r.roster_id] = userIdToManagerKey[r.owner_id]; });

  const teams = rosters.map(r => {
    const managerKey = rosterIdToManagerKey[r.roster_id];
    const s = r.settings || {};
    return {
      rosterId: r.roster_id,
      managerKey,
      name: managerKey ? getTeamName(managerKey, year) : `Team ${r.roster_id}`,
      wins: s.wins || 0,
      losses: s.losses || 0,
      pf: (s.fpts || 0) + ((s.fpts_decimal || 0) / 100),
      pa: (s.fpts_against || 0) + ((s.fpts_against_decimal || 0) / 100)
    };
  });

  const seasonData = {
    league, rosters, users, teams,
    userIdToManagerKey, rosterIdToManagerKey,
    playoffWeekStart: league.settings ? league.settings.playoff_week_start : null,
    matchupsByWeek: {}
  };
  DB.seasons[year] = seasonData;
  return seasonData;
}

async function loadAllSeasons(){
  const years = Object.keys(LEAGUE_IDS).map(Number);
  await Promise.all(years.map(y => loadSeason(y)));
}

// Regular-season weeks only (1 .. playoffWeekStart-1) — playoff scoring is excluded
// entirely from player-facing stat tracking per league rules confirmed in-thread.
//
// Scoring source priority mirrors the football archive exactly:
//   1. Sleeper's own matchup.players_points[pid] — most reliable, already respects
//      league scoring_settings AND correctly reflects whichever of the week's two
//      games a manager locked in (Sleeper computes this itself; no special-casing needed).
//   2. Raw stats + league scoring_settings via calcPoints(), when players_points is missing.
//   3. Pre-aggregated pts fields as a last resort.
// Results are pushed into DB.allStarters as a FLAT array (not nested by week), matching
// the football archive's shape — this is what powers leaderboards, POTG, and any
// week-over-week trend views off one shared list.
async function loadSeasonScoring(year){
  const season = DB.seasons[year];
  if(!season) return;
  const leagueId = LEAGUE_IDS[year];
  const lastRegWeek = (season.playoffWeekStart || 19) - 1;
  const weeks = Array.from({length:lastRegWeek}, (_,i) => i+1);

  const [matchupResults, statResults] = await Promise.all([
    Promise.all(weeks.map(w => apiFetch(`/league/${leagueId}/matchups/${w}`).then(mu=>({w,mu})).catch(()=>({w,mu:[]})))),
    Promise.all(weeks.map(w => apiFetch(`/stats/nba/regular/${year}/${w}`).then(s=>({w,s})).catch(()=>({w,s:{}}))))
  ]);

  const statByWeek = {};
  statResults.forEach(({w,s}) => { statByWeek[w] = s; });
  matchupResults.forEach(({w,mu}) => { season.matchupsByWeek[w] = mu; });

  const scoring = season.league.scoring_settings || {};

  matchupResults.forEach(({w,mu}) => {
    mu.forEach(entry => {
      const managerKey = season.rosterIdToManagerKey[entry.roster_id];
      const team = season.teams.find(t => t.rosterId === entry.roster_id);
      const matchupPts = entry.players_points || {};
      (entry.starters || []).forEach(pid => {
        if(!pid || pid === '0') return;
        let points = null;
        if(matchupPts[pid] !== undefined){
          points = matchupPts[pid];
        } else {
          const ps = (statByWeek[w] || {})[pid];
          if(ps){
            points = calcPoints(ps, scoring);
            // pts_ppr/pts_half_ppr are NFL-only (points-per-reception) and don't exist in NBA
            // stat objects — confirmed live: basketball's pre-aggregated field is pts_std.
            if(points === null) points = ps.pts_std ?? null;
          }
        }
        DB.allStarters.push({
          pid, week:w, year,
          points,
          teamRosterId: entry.roster_id,
          teamName: team ? team.name : 'Unknown',
          managerKey
        });
      });
    });
  });
}

// Generic scoring calculator — iterates every key in the league's scoring_settings
// and multiplies by the matching stat value. Sleeper uses identical key names across
// sports, so this needs no NBA-specific translation; ported directly from football.
function calcPoints(stats, scoring){
  if(!stats || !scoring || Object.keys(scoring).length === 0) return null;
  let pts = 0, hasAny = false;
  for(const [key, weight] of Object.entries(scoring)){
    if(weight === 0) continue;
    const val = stats[key];
    if(val !== undefined && val !== null && val !== 0){
      pts += val * weight;
      hasAny = true;
    }
  }
  if(!hasAny) return null;
  return Math.round(pts * 100) / 100;
}

let PLAYER_NAME_INDEX = null; // built lazily by buildPlayerNameMap()
const PID_OVERRIDES = {
  // 'search string': 'sleeper_pid'  — fill in as edge cases surface
};

function normalizeNameForMatch(s){
  return (s||'').toLowerCase().replace(/[.'-]/g,'').replace(/\s+jr$|\s+sr$|\s+iii$|\s+ii$|\s+iv$/,'').trim();
}

function buildPlayerNameMap(){
  PLAYER_NAME_INDEX = {};
  Object.keys(DB.playerMeta).forEach(pid => {
    const key = normalizeNameForMatch(DB.playerMeta[pid].name);
    if(key) PLAYER_NAME_INDEX[key] = pid;
  });
}

function lookupPid(name){
  if(PID_OVERRIDES[name]) return PID_OVERRIDES[name];
  if(!PLAYER_NAME_INDEX) buildPlayerNameMap();
  const key = normalizeNameForMatch(name);
  return PLAYER_NAME_INDEX[key] || null;
}

  document.querySelectorAll('.panel').forEach(panelEl => {
    panelEl.classList.toggle('active', panelEl.id === `panel-${name}`);
  });
  document.querySelectorAll('[data-nav]').forEach(navEl => {
    navEl.classList.toggle('active', navEl.dataset.nav === name);
  });
  document.querySelectorAll('[data-navgroup]').forEach(navEl => {
    navEl.classList.toggle('active', navEl.dataset.navgroup === page.group);
  });

  if(page.group){ activeBottomGroup = page.group; }
  renderBottomSubrow();

  if(RENDER_FNS[name]) RENDER_FNS[name]();
}

function renderPlayersTableBody(){
  const body = document.getElementById('players-table-body');
  if(!body) return;
  const search = normalizeNameForMatch(document.getElementById('players-search')?.value || '');
  const posFilter = document.getElementById('players-pos-filter')?.value || 'all';
  const selected = DB.selectedPlayersYear || 'all';

  const starters = selected === 'all' ? DB.allStarters : DB.allStarters.filter(s => s.year === selected);

  const agg = {};
  starters.forEach(s => {
    if(!agg[s.pid]) agg[s.pid] = {pid:s.pid, starts:0, total:0, best:0};
    agg[s.pid].starts++;
    agg[s.pid].total += (s.points || 0);
    if((s.points || 0) > agg[s.pid].best) agg[s.pid].best = s.points || 0;
  });

  let rows = Object.values(agg).map(p => {
    const meta = DB.playerMeta[p.pid] || {};
    const positions = getPlayerPositions(p.pid, selected === 'all' ? CURRENT_SEASON : selected);
    return {...p, name: meta.name || `Player ${p.pid}`, teamAbbr: meta.teamAbbr || '', positions, avg: p.starts ? p.total/p.starts : 0};
  });

  if(search) rows = rows.filter(r => normalizeNameForMatch(r.name).includes(search));
  if(posFilter !== 'all') rows = rows.filter(r => r.positions.includes(posFilter));

  const dir = playersSort.dir;
  const sf = {
    total:(a,b)=>(a.total-b.total)*dir,
    starts:(a,b)=>(a.starts-b.starts)*dir,
    avg:(a,b)=>(a.avg-b.avg)*dir,
    best:(a,b)=>(a.best-b.best)*dir
  };
  rows.sort(sf[playersSort.col] || sf.total);

  if(!rows.length){ body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-faint);padding:24px;">No players found.</td></tr>`; return; }

  body.innerHTML = rows.slice(0,200).map(r => `<tr>
    <td><a href="#" onclick="openPlayerModal('${r.pid}');return false;">${r.name}</a></td>
    <td>${renderPositionBadge(r.positions)}</td>
    <td style="color:var(--text-dim);font-size:12px;">${r.teamAbbr}</td>
    <td>${r.total.toFixed(1)}</td>
    <td>${r.starts}</td>
    <td>${r.avg.toFixed(1)}</td>
    <td>${r.best.toFixed(1)}</td>
  </tr>`).join('');
}

/* ============================================================
   SIGN-IN / MANAGER ROUTING
   Matches the entered username against the known MANAGERS roster
   (case-insensitive, resolving known aliases like GelEBeans -> CarlCanary)
   rather than hitting Sleeper's /user endpoint — this is a closed
   12-person league, so membership in our own roster IS the identity
   check that matters here, and it costs zero extra API calls.
   ============================================================ */
function resolveManagerFromUsername(rawUsername){
  if(!rawUsername) return null;
  const lower = rawUsername.toLowerCase();
  const directKey = Object.keys(MANAGERS).find(k => k.toLowerCase() === lower);
  if(directKey) return directKey;
  const aliasKey = Object.keys(USERNAME_ALIASES).find(k => k.toLowerCase() === lower);
  if(aliasKey) return USERNAME_ALIASES[aliasKey];
  return null;
}

function setSetupStatus(msg, isError=false){
  const el = document.getElementById('setup-status');
  el.textContent = msg;
  el.classList.toggle('error', isError);
}
function setSetupProgress(pct){
  document.getElementById('prog-fill').style.width = `${pct}%`;
}

async function startArchiveLoad(guest=false){
  const btn = document.getElementById('btn-load');
  const username = guest ? '' : document.getElementById('inp-user').value.trim();

  if(CF_WORKER_URL.includes('YOUR-WORKER')){
    setSetupStatus('CF_WORKER_URL is still a placeholder — set it to your deployed Cloudflare Worker.', true);
    return;
  }

  btn.disabled = true;
  DB.myUsername = username || null;
  DB.myManagerKey = username ? resolveManagerFromUsername(username) : null;

  if(username && !DB.myManagerKey){
    setSetupStatus(`"${username}" isn't a recognized Fellowship manager — continuing without My Team personalization.`);
  } else {
    setSetupStatus('Loading the archive…');
  }
  setSetupProgress(5);

  try{
    await loadAllData((pct, msg) => { setSetupProgress(pct); if(msg) setSetupStatus(msg); });
    DB.loaded = true;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAll();
  }catch(e){
    console.error('Data load failed:', e);
    setSetupStatus('Error loading the archive: ' + e.message, true);
    btn.disabled = false;
  }
}

// The actual Sleeper data pipeline, extracted from the old init() so it can report
// progress back to the sign-in screen. onProgress(pct, message) fires at each major step.
async function loadAllData(onProgress = () => {}){
  onProgress(10, 'Loading season data…');
  await loadAllSeasons();

  onProgress(30, 'Loading player pool…');
  await loadPlayerPool();
  buildPlayerNameMap();

  onProgress(50, 'Loading draft picks…');
  await loadAllDraftPicks();
  await loadStartupDraft();

  const years = Object.keys(LEAGUE_IDS).map(Number).filter(y => y < CURRENT_SEASON);
  for(let i=0; i<years.length; i++){
    const y = years[i];
    onProgress(55 + Math.round((i/years.length)*40), `Loading ${seasonLabel(y)} scoring… (${i+1}/${years.length})`);
    await loadSeasonScoring(y);
    buildHonorsForYear(y);
  }
  onProgress(100, '');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inp-user').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') startArchiveLoad();
  });
});
</script>
</body>
